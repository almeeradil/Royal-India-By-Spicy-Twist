    // ==========================================
    // MODULE: LABOR & PRIME COST REPORT
    // ==========================================
    function LaborReportModule({ orders, attendance, wasteLogs, setWasteLogs, branches, selectedBranchId, showToast, cloudConnected, allowedEmails, C }) {
      const defaultBranch = selectedBranchId !== 'all' ? selectedBranchId : branches[0]?.id || 'b1';
      const [wasteForm, setWasteForm] = useState({ ingredient: '', qty: '', cost: '', reason: '', branchId: defaultBranch });

      const grossSales = orders.filter((o) => o.status !== 'Cancelled').reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
      const totalLaborHours = attendance.reduce((sum, a) => sum + Number(a.totalHours || 0), 0);
      const estimatedLaborCost = totalLaborHours * 750;
      const totalWasteCost = wasteLogs.reduce((sum, w) => sum + Number(w.cost || 0), 0);
      const estimatedCOGS = grossSales * 0.32;
      const primeCost = estimatedCOGS + estimatedLaborCost;

      const laborPercent = grossSales > 0 ? ((estimatedLaborCost / grossSales) * 100).toFixed(1) : 0;
      const primeCostPercent = grossSales > 0 ? ((primeCost / grossSales) * 100).toFixed(1) : 0;

      const handleAddWaste = async (e) => {
        e.preventDefault();
        if (!wasteForm.ingredient.trim() || !wasteForm.cost) return;
        const id = `w-${Date.now()}`;
        const newWaste = {
          id,
          ingredient: C.clampStr(wasteForm.ingredient, C.LIMITS.nameMax),
          qty: C.clampStr(wasteForm.qty || '1 unit', C.LIMITS.qtyStrMax),
          cost: C.clampNum(wasteForm.cost, 0),
          reason: C.clampStr(wasteForm.reason || 'Logged waste', C.LIMITS.notesMax),
          branchId: C.sanitizeId(wasteForm.branchId || defaultBranch, 'b1'),
          date: new Date().toISOString().split('T')[0],
        };
        try {
          if (cloudConnected) {
            await C.createCloudDoc('wasteLogs', id, newWaste, allowedEmails, { hasUpdatedAt: false });
          } else {
            setWasteLogs([newWaste, ...wasteLogs]);
          }
          setWasteForm({ ingredient: '', qty: '', cost: '', reason: '', branchId: defaultBranch });
          showToast('Food waste logged & synced!', 'warning');
        } catch (err) {
          showToast('Could not log waste to cloud.', 'error');
        }
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <span className="text-xs font-semibold text-slate-500">Labor Cost % against Sales</span>
              <h3 className="text-2xl font-extrabold text-orange-600 mt-1">{laborPercent}%</h3>
              <p className="text-[11px] text-slate-400 mt-1">Est. Labor Cost: Rs. {estimatedLaborCost.toLocaleString()}</p>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <span className="text-xs font-semibold text-slate-500">Prime Cost (COGS + Labor)</span>
              <h3 className="text-2xl font-extrabold text-slate-900 mt-1">Rs. {primeCost.toLocaleString(undefined, { maximumFractionDigits: 0 })}</h3>
              <p className="text-[11px] text-orange-600 font-bold mt-1">{primeCostPercent}% of Gross Revenue</p>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <span className="text-xs font-semibold text-slate-500">Recorded Food Waste Cost</span>
              <h3 className="text-2xl font-extrabold text-rose-600 mt-1">Rs. {totalWasteCost.toLocaleString()}</h3>
              <p className="text-[11px] text-slate-400 mt-1">{wasteLogs.length} logged waste entries</p>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
              <Icon name="trash-2" className="w-4 h-4 text-rose-600" /> Log Food Waste & Inventory Loss
            </h3>
            <form onSubmit={handleAddWaste} className="grid grid-cols-1 md:grid-cols-6 gap-3 text-xs">
              <input type="text" placeholder="Ingredient name..." value={wasteForm.ingredient} onChange={(e) => setWasteForm({ ...wasteForm, ingredient: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="text" placeholder="Qty (e.g. 2 kg)..." value={wasteForm.qty} onChange={(e) => setWasteForm({ ...wasteForm, qty: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="number" placeholder="Cost (Rs.)..." value={wasteForm.cost} onChange={(e) => setWasteForm({ ...wasteForm, cost: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="text" placeholder="Reason (Expired/Burnt)..." value={wasteForm.reason} onChange={(e) => setWasteForm({ ...wasteForm, reason: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <select value={wasteForm.branchId} onChange={(e) => setWasteForm({ ...wasteForm, branchId: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold">
                {branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
              <button type="submit" className="bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl py-2.5">Log Waste</button>
            </form>

            <table className="w-full text-left text-xs text-slate-700 mt-4">
              <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px]">
                <tr>
                  <th className="p-3">Ingredient</th>
                  <th className="p-3">Quantity</th>
                  <th className="p-3">Waste Cost (Rs.)</th>
                  <th className="p-3">Reason</th>
                  <th className="p-3">Date</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {wasteLogs.map((w) => (
                  <tr key={w.id}>
                    <td className="p-3 font-bold text-slate-800">{w.ingredient}</td>
                    <td className="p-3">{w.qty}</td>
                    <td className="p-3 font-bold text-rose-600">Rs. {w.cost}</td>
                    <td className="p-3 text-slate-500">{w.reason}</td>
                    <td className="p-3 text-slate-400">{w.date}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: RECIPES & FOOD COSTING
    // ==========================================
    function RecipesModule({ recipes, setRecipes, menuItems, showToast, cloudConnected, allowedEmails, C }) {
      const [form, setForm] = useState({ menuName: '', cogs: '', sellingPrice: '', ingName: '', ingQty: '', ingCost: '' });

      const handleAddRecipe = async (e) => {
        e.preventDefault();
        const sellingPrice = Number(form.sellingPrice);
        const cogs = Number(form.cogs);
        if (!form.menuName.trim() || !Number.isFinite(sellingPrice) || sellingPrice <= 0) {
          showToast('Enter a dish name and valid selling price.', 'error');
          return;
        }
        const id = `rc-${Date.now()}`;
        const ingredients = form.ingName.trim()
          ? [{ name: C.clampStr(form.ingName, C.LIMITS.nameMax), qty: C.clampStr(form.ingQty || '1', C.LIMITS.qtyStrMax), cost: C.clampNum(form.ingCost || cogs, 0) }]
          : [];
        const newRc = {
          id,
          menuName: C.clampStr(form.menuName, C.LIMITS.nameMax),
          cogs: C.clampNum(cogs, 0),
          sellingPrice: C.clampNum(sellingPrice, 1),
          ingredients,
        };
        try {
          if (cloudConnected) {
            await C.createCloudDoc('recipes', id, newRc, allowedEmails);
          } else {
            setRecipes((prev) => [newRc, ...prev]);
          }
          setForm({ menuName: '', cogs: '', sellingPrice: '', ingName: '', ingQty: '', ingCost: '' });
          showToast('Recipe cost card saved!', 'success');
        } catch (err) {
          showToast('Could not save recipe.', 'error');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Recipe & Ingredient Food Costing</h2>
              <p className="text-xs text-slate-500">Analyze COGS per dish, calculate profit margins, and standardize kitchen recipes</p>
            </div>
            <form onSubmit={handleAddRecipe} className="grid grid-cols-1 md:grid-cols-6 gap-3 text-xs">
              <input type="text" placeholder="Dish / Menu Name..." value={form.menuName} onChange={(e) => setForm({ ...form, menuName: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold" />
              <input type="number" min="1" placeholder="Selling Price (Rs.)" value={form.sellingPrice} onChange={(e) => setForm({ ...form, sellingPrice: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="number" min="0" placeholder="Total COGS (Rs.)" value={form.cogs} onChange={(e) => setForm({ ...form, cogs: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="text" placeholder="Key Ingredient" value={form.ingName} onChange={(e) => setForm({ ...form, ingName: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="text" placeholder="Qty (e.g. 500g)" value={form.ingQty} onChange={(e) => setForm({ ...form, ingQty: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <button type="submit" className="bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl py-2.5">Save Recipe</button>
            </form>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {recipes.map((rc) => {
              const margin = Number(rc.sellingPrice || 0) - Number(rc.cogs || 0);
              const marginPct = rc.sellingPrice > 0 ? ((margin / rc.sellingPrice) * 100).toFixed(1) : '0.0';
              return (
                <div key={rc.id} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                  <div className="flex justify-between items-start">
                    <h4 className="font-extrabold text-slate-900 text-sm">{rc.menuName}</h4>
                    <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">{marginPct}% Margin</span>
                  </div>
                  <div className="text-xs space-y-1">
                    <p className="text-slate-500">Selling Price: <span className="font-bold text-slate-900">Rs. {rc.sellingPrice}</span></p>
                    <p className="text-slate-500">Dish COGS: <span className="font-bold text-rose-600">Rs. {rc.cogs}</span></p>
                    <p className="text-slate-500">Profit Margin: <span className="font-bold text-emerald-600">Rs. {margin}</span></p>
                  </div>
                  {(rc.ingredients || []).length > 0 && (
                    <div className="pt-2 border-t border-slate-100 text-[11px] text-slate-600 space-y-1">
                      {(rc.ingredients || []).map((ing, i) => (
                        <div key={i} className="flex justify-between">
                          <span>{ing.name} ({ing.qty})</span>
                          <span className="font-semibold">Rs. {ing.cost}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: LOYALTY, PROMOS & GIFT CARDS
    // ==========================================
    function LoyaltyModule({ customers, giftCards, setGiftCards, promos, setPromos, showToast, cloudConnected, allowedEmails, C }) {
      const [newPromoCode, setNewPromoCode] = useState('');
      const [newPromoType, setNewPromoType] = useState('percentage');
      const [newPromoVal, setNewPromoVal] = useState('');
      const [gcCode, setGcCode] = useState('');
      const [gcCustomer, setGcCustomer] = useState('');

          id,
          code: C.clampStr(newPromoCode.toUpperCase(), C.LIMITS.promoCodeMax),

    function ReservationsModule({ reservations, setReservations, branches, selectedBranchId, showToast, cloudConnected, allowedEmails, C }) {
      const defaultBranch = selectedBranchId !== 'all' ? selectedBranchId : branches[0]?.id || 'b1';
      const [resForm, setResForm] = useState({ guestName: '', phone: '', guests: 2, date: new Date().toISOString().split('T')[0], time: '20:00', branchId: defaultBranch, table: 'T-01', notes: '' });

      const handleAddRes = async (e) => {
        e.preventDefault();
        if (!resForm.guestName.trim() || !resForm.phone.trim()) return;
        const id = `r-${Date.now()}`;
        const newR = {
          id,
          guestName: C.clampStr(resForm.guestName, C.LIMITS.shortNameMax),
          phone: C.clampStr(resForm.phone, C.LIMITS.phoneMax),
          guests: C.clampNum(resForm.guests, 1, 200),
          date: C.clampStr(resForm.date || new Date().toISOString().split('T')[0], C.LIMITS.dateMax),
          time: C.clampStr(resForm.time || '20:00', C.LIMITS.dateMax),
          branchId: C.sanitizeId(resForm.branchId || defaultBranch, 'b1'),
          table: C.clampStr(resForm.table || 'T-01', C.LIMITS.tableMax),
          status: 'Confirmed',
          notes: C.clampStr(resForm.notes || '', C.LIMITS.notesMax),
        };
        try {
          if (cloudConnected) await C.createCloudDoc('reservations', id, newR, allowedEmails);
          else setReservations([newR, ...reservations]);
          setResForm({ guestName: '', phone: '', guests: 2, date: new Date().toISOString().split('T')[0], time: '20:00', branchId: defaultBranch, table: 'T-01', notes: '' });
          showToast(`Reservation created for ${newR.guestName}!`, 'success');
        } catch (err) {
          showToast('Failed to save reservation.', 'error');
        }
      };

      const updateStatus = async (res, status) => {
        try {
          if (cloudConnected) await C.updateCloudDoc('reservations', res.id, { status });
          else setReservations((prev) => prev.map((x) => x.id === res.id ? { ...x, status } : x));
          showToast(`${res.guestName} marked ${status}`, 'success');
        } catch (err) {
          showToast('Could not update reservation.', 'error');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900">Book Table Reservation / Walk-in Waitlist</h3>
            <form onSubmit={handleAddRes} className="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs font-medium">
              <input type="text" placeholder="Guest Name..." value={resForm.guestName} onChange={(e) => setResForm({ ...resForm, guestName: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" />
              <input type="text" placeholder="Phone (+92...)" value={resForm.phone} onChange={(e) => setResForm({ ...resForm, phone: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="number" min="1" placeholder="Guests count" value={resForm.guests} onChange={(e) => setResForm({ ...resForm, guests: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" />
              <input type="date" value={resForm.date} onChange={(e) => setResForm({ ...resForm, date: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="time" value={resForm.time} onChange={(e) => setResForm({ ...resForm, time: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <select value={resForm.branchId} onChange={(e) => setResForm({ ...resForm, branchId: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold">
                {branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
              <input type="text" placeholder="Table (e.g. T-01)" value={resForm.table} onChange={(e) => setResForm({ ...resForm, table: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="text" placeholder="Notes (Window seat, etc.)" value={resForm.notes} onChange={(e) => setResForm({ ...resForm, notes: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <button type="submit" className="md:col-span-4 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl py-2.5">Confirm Booking & Sync</button>
            </form>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs text-slate-700">
              <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px]">
                <tr>
                  <th className="p-4">Guest Name</th>
                  <th className="p-4">Phone</th>
                  <th className="p-4">Party Size</th>
                  <th className="p-4">Date, Time & Table</th>
                  <th className="p-4">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {reservations.map((r) => (
                  <tr key={r.id}>
                    <td className="p-4 font-bold text-slate-900">{r.guestName}{r.notes && <span className="block text-[10px] font-normal text-slate-400">{r.notes}</span>}</td>
                    <td className="p-4 text-slate-600">{r.phone}</td>
                    <td className="p-4 font-bold text-orange-600">{r.guests} Guests</td>
                    <td className="p-4 font-medium">{r.date} · {r.time} ({r.table})</td>
                    <td className="p-4">
                      <select
                        value={r.status}
                        onChange={(e) => updateStatus(r, e.target.value)}
                        className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border-0 outline-none"
                      >
                        {['Confirmed', 'Waitlist', 'Seated', 'Cancelled'].map((s) => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: STAFF DIRECTORY & SECURITY ROLES
    // ==========================================
    function StaffDirectoryModule({ users, setUsers, branches, showToast, cloudConnected, allowedEmails, authorizedStaffList, C }) {
      const [staffForm, setStaffForm] = useState({ name: '', role: 'Waiter', branch_id: branches[0]?.id || 'b1', email: '', phone: '', hourly_rate: '500' });
      const [authForm, setAuthForm] = useState({ email: '', name: '', role: 'Chef' });

      const handleAddStaff = async (e) => {
        e.preventDefault();
        if (!staffForm.name.trim()) return;
        const id = `u-${Date.now()}`;
        const newU = {
          id,
          name: C.clampStr(staffForm.name, C.LIMITS.shortNameMax),
          role: staffForm.role,
          branch_id: staffForm.branch_id,
          email: C.clampStr(staffForm.email, C.LIMITS.emailMax),
          avatar: C.DEFAULT_AVATAR_URL,
          phone: C.clampStr(staffForm.phone, C.LIMITS.phoneMax),
          status: 'Active',
          hourly_rate: C.clampNum(staffForm.hourly_rate, 0, 1000000),
        };
        try {
          if (cloudConnected) await C.createCloudDoc('staffUsers', id, newU, allowedEmails);
          else setUsers((prev) => [...prev, newU]);
          setStaffForm({ name: '', role: 'Waiter', branch_id: branches[0]?.id || 'b1', email: '', phone: '', hourly_rate: '500' });
          showToast(`${newU.name} added to Staff Directory!`, 'success');
        } catch (err) {
          showToast('Could not add staff member.', 'error');
        }
      };

      const handleAuthorizeEmail = async (e) => {
        e.preventDefault();
        const email = authForm.email.trim().toLowerCase();
        if (!email || !authForm.name.trim()) return;
        if (!cloudConnected) {
          showToast('Connect Google Cloud Sync first to authorize other laptops.', 'warning');
          return;
        }
        try {
          await C.authorizeStaffEmail(email, authForm.name, authForm.role);
          const updatedEmails = C.normalizeAllowedEmails([...allowedEmails, email]);
          await C.syncAllowedEmailsAcrossCollections(updatedEmails);
          setAuthForm({ email: '', name: '', role: 'Chef' });
          showToast(`${email} authorized for live multi-laptop sync!`, 'success');
        } catch (err) {
          showToast('Only an Admin Google account can authorize staff terminals.', 'error');
        }
      };

      const handleRevokeEmail = async (email) => {
        try {
          await C.revokeStaffEmail(email);
          const updatedEmails = C.normalizeAllowedEmails(allowedEmails.filter((e) => e !== email));
          await C.syncAllowedEmailsAcrossCollections(updatedEmails);
          showToast(`Revoked access for ${email}`, 'warning');
        } catch (err) {
          showToast('Could not revoke access.', 'error');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Staff & Security Directory</h2>
              <p className="text-xs text-slate-500">Manage staff roles (Cashier vs Manager vs Kitchen vs Waiter), branch access, and hourly rates in PKR</p>
            </div>
            <form onSubmit={handleAddStaff} className="grid grid-cols-1 md:grid-cols-6 gap-3 text-xs">
              <input type="text" placeholder="Full Name..." value={staffForm.name} onChange={(e) => setStaffForm({ ...staffForm, name: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold" />
              <select value={staffForm.role} onChange={(e) => setStaffForm({ ...staffForm, role: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold">
                {['Super Admin', 'Branch Manager', 'Cashier', 'Waiter', 'Chef', 'Kitchen'].map((r) => <option key={r} value={r}>{r}</option>)}
              </select>
              <select value={staffForm.branch_id} onChange={(e) => setStaffForm({ ...staffForm, branch_id: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold">
                <option value="all">All Branches</option>
                {branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
              <input type="email" placeholder="Email" value={staffForm.email} onChange={(e) => setStaffForm({ ...staffForm, email: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="number" min="0" placeholder="Hourly Rate (Rs.)" value={staffForm.hourly_rate} onChange={(e) => setStaffForm({ ...staffForm, hourly_rate: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <button type="submit" className="bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl py-2.5">Add Staff</button>
            </form>
          </div>

          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm space-y-4">
            <div>
              <h3 className="font-bold text-sm text-slate-900">Multi-Laptop Authorized Gmail Accounts (Waiter / Chef / Cashier)</h3>
              <p className="text-xs text-slate-500">Authorize Gmail accounts so Waiter & Chef laptops can read and update live orders in real time</p>
            </div>
            <form onSubmit={handleAuthorizeEmail} className="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
              <input type="email" required placeholder="Staff Google Email (e.g. chef@gmail.com)" value={authForm.email} onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold" />
              <input type="text" required placeholder="Staff Name" value={authForm.name} onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <select value={authForm.role} onChange={(e) => setAuthForm({ ...authForm, role: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold">
                {['Branch Manager', 'Cashier', 'Waiter', 'Chef', 'Kitchen'].map((r) => <option key={r} value={r}>{r}</option>)}
              </select>
              <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl py-2.5">Authorize Laptop Access</button>
            </form>
            {authorizedStaffList.length > 0 && (
              <div className="flex flex-wrap gap-2 pt-1">
                {authorizedStaffList.map((s) => (
                  <span key={s.email} className="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs">

                    <span className="text-slate-500">{s.email}</span>
                    <span className="rounded bg-orange-100 px-1.5 py-0.5 text-[10px] font-bold text-orange-700">{s.role}</span>
                    <button type="button" onClick={() => handleRevokeEmail(s.email)} className="text-rose-600 font-bold hover:underline">Revoke</button>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                <div className="flex items-center gap-3">

                    <h4 className="font-bold text-sm text-slate-900">{u.name}</h4>

    // ==========================================
    // MODULE: SCHEDULING & TIME CLOCK ATTENDANCE
    // ==========================================
    function SchedulingModule({ shifts, setShifts, attendance, setAttendance, users, branches, showToast, cloudConnected, allowedEmails, C }) {
      const [selectedStaffId, setSelectedStaffId] = useState(users[0]?.id || 'u3');
      const [shiftForm, setShiftForm] = useState({ userId: users[0]?.id || 'u2', date: new Date().toISOString().split('T')[0], startTime: '09:00', endTime: '17:00', branchId: branches[0]?.id || 'b1' });

      const handleClockIn = async () => {
        const staff = users.find((u) => u.id === selectedStaffId) || users[0];
        if (!staff) return;
        const timeStr = new Date().toLocaleTimeString();
        const id = `a-${Date.now()}`;
        const newAtt = {
          id,
          userId: C.sanitizeId(staff.id, 'u'),
          userName: C.clampStr(staff.name, C.LIMITS.shortNameMax),
          clockIn: C.clampStr(timeStr, C.LIMITS.phoneMax),
          clockOut: 'In Progress',
          totalHours: 0,
          date: new Date().toISOString().split('T')[0],
        };
        try {
          if (cloudConnected) await C.createCloudDoc('attendance', id, newAtt, allowedEmails);
          else setAttendance([newAtt, ...attendance]);
          showToast(`${staff.name} clocked IN at ${timeStr}`, 'success');
        } catch (err) {
          showToast('Could not clock in.', 'error');
        }
      };

      const handleClockOut = async (rec) => {
        const timeStr = new Date().toLocaleTimeString();
        try {
          if (cloudConnected) await C.updateCloudDoc('attendance', rec.id, { clockOut: timeStr, totalHours: 8 });
          else setAttendance((prev) => prev.map((a) => a.id === rec.id ? { ...a, clockOut: timeStr, totalHours: 8 } : a));
          showToast(`${rec.userName} clocked OUT at ${timeStr}`, 'success');
        } catch (err) {
          showToast('Could not clock out.', 'error');
        }
      };

      const handleAddShift = async (e) => {
        e.preventDefault();
        const staff = users.find((u) => u.id === shiftForm.userId) || users[0];
        if (!staff) return;
        const id = `s-${Date.now()}`;
        const newShift = {
          id,
          userId: C.sanitizeId(staff.id, 'u'),
          userName: C.clampStr(staff.name, C.LIMITS.shortNameMax),
          role: C.clampStr(staff.role, C.LIMITS.roleMax),
          date: shiftForm.date,
          startTime: shiftForm.startTime,
          endTime: shiftForm.endTime,
          branchId: C.sanitizeId(shiftForm.branchId, 'b1'),
          status: 'Scheduled',
        };
        try {
          if (cloudConnected) await C.createCloudDoc('shifts', id, newShift, allowedEmails);
          else setShifts((prev) => [newShift, ...prev]);
          showToast('Shift scheduled!', 'success');
        } catch (err) {
          showToast('Only Admin can schedule shifts in cloud.', 'error');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Shift Scheduling & Attendance</h2>
              <p className="text-xs text-slate-500">Coordinate shifts, time clocks, and staff attendance</p>
            </div>
            <div className="flex items-center gap-2">
              <select value={selectedStaffId} onChange={(e) => setSelectedStaffId(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-semibold">
                {users.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
              <button onClick={handleClockIn} className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow-md">
                <Icon name="clock" className="w-4 h-4" /> Quick Time Clock IN
              </button>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900">Assign Shift</h3>
            <form onSubmit={handleAddShift} className="grid grid-cols-1 md:grid-cols-6 gap-3 text-xs">
              <select value={shiftForm.userId} onChange={(e) => setShiftForm({ ...shiftForm, userId: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold">
                {users.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
              <input type="date" value={shiftForm.date} onChange={(e) => setShiftForm({ ...shiftForm, date: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="time" value={shiftForm.startTime} onChange={(e) => setShiftForm({ ...shiftForm, startTime: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <input type="time" value={shiftForm.endTime} onChange={(e) => setShiftForm({ ...shiftForm, endTime: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5" />
              <select value={shiftForm.branchId} onChange={(e) => setShiftForm({ ...shiftForm, branchId: e.target.value })} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold">
                {branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
              <button type="submit" className="bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl py-2.5">Schedule Shift</button>
            </form>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900">Attendance & Time Clock Records</h3>
            <table className="w-full text-left text-xs text-slate-700">
              <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px]">
                <tr>
                  <th className="p-3">Staff Member</th>
                  <th className="p-3">Clock In</th>
                  <th className="p-3">Clock Out</th>
                  <th className="p-3">Total Shift Hours</th>
                  <th className="p-3">Date</th>
                  <th className="p-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {attendance.map((a) => (
                  <tr key={a.id}>
                    <td className="p-3 font-bold text-slate-900">{a.userName}</td>
                    <td className="p-3 font-medium text-emerald-600">{a.clockIn}</td>
                    <td className="p-3 font-medium text-slate-600">{a.clockOut}</td>
                    <td className="p-3 font-bold text-orange-600">{a.totalHours} hrs</td>
                    <td className="p-3 text-slate-400">{a.date}</td>
                    <td className="p-3 text-right">
                      {a.clockOut === 'In Progress' && (
                        <button type="button" onClick={() => handleClockOut(a)} className="rounded-lg bg-slate-900 px-2.5 py-1 text-[11px] font-bold text-white hover:bg-slate-800">Clock Out</button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: PAYROLL & TIP POOLING
    // ==========================================
    function PayrollModule({ users, attendance, showToast }) {
      const exportPayrollCsv = () => {
        const rows = [['Employee', 'Role', 'Hourly Rate (PKR)', 'Logged Hours', 'Gross Wage (Rs.)']];
        users.forEach((u) => {
          const hours = attendance.filter((a) => a.userId === u.id).reduce((sum, a) => sum + Number(a.totalHours || 0), 0);
          const rate = u.hourly_rate || 500;
          rows.push([u.name, u.role, String(rate), String(hours), String(hours * rate)]);
        });
        const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `payroll-${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('Payroll dataset exported to CSV file!', 'info');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex items-center justify-between">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Payroll & Tip Declarations</h2>
              <p className="text-xs text-slate-500">Calculate total hours worked, hourly wages, and export CSV for payroll processing</p>
            </div>
            <button onClick={exportPayrollCsv} className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs flex items-center gap-2">
              <Icon name="download" className="w-4 h-4" /> Export Payroll Data
            </button>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs text-slate-700">
              <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px]">
                <tr>
                  <th className="p-4">Employee</th>
                  <th className="p-4">Role</th>
                  <th className="p-4">Hourly Rate (PKR)</th>
                  <th className="p-4">Logged Hours</th>
                  <th className="p-4">Gross Wage (Rs.)</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {users.map((u) => {
                  const hours = attendance.filter((a) => a.userId === u.id).reduce((sum, a) => sum + Number(a.totalHours || 0), 0);
                  const rate = u.hourly_rate || 500;
                  const grossWage = hours * rate;
                  return (
                    <tr key={u.id}>
                      <td className="p-4 font-bold text-slate-900">{u.name}</td>
                      <td className="p-4 font-semibold text-slate-600">{u.role}</td>
                      <td className="p-4 font-medium">Rs. {rate} / hr</td>
                      <td className="p-4 font-bold text-orange-600">{hours} hrs</td>
                      <td className="p-4 font-extrabold text-emerald-600">Rs. {grossWage.toLocaleString()}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: MENU MANAGEMENT
    // ==========================================
    function MenuManagementModule({ menuItems, setMenuItems, branches, showToast, cloudConnected, allowedEmails, C }) {
      const [form, setForm] = useState({ name: '', category: 'BBQ', price: '', stock: '50', image: '' });
      const [selectedBranches, setSelectedBranches] = useState(() => branches.map((b) => b.id));

      useEffect(() => {
        if (selectedBranches.length === 0 && branches.length > 0) {
          setSelectedBranches(branches.map((b) => b.id));
        }
      }, [branches]);

      const toggleBranch = (bid) => {
        setSelectedBranches((prev) => prev.includes(bid) ? prev.filter((x) => x !== bid) : [...prev, bid]);
      };

      const addItem = async (event) => {
        event.preventDefault();
        const price = Number(form.price);
        const stock = Number(form.stock);
        if (!form.name.trim() || !Number.isFinite(price) || price <= 0 || !Number.isInteger(stock) || stock < 0) {
          showToast('Enter a dish name, a valid price, and a whole-number stock quantity of zero or more.', 'error');
          return;
        }
        const id = `menu-${Date.now()}`;
        const availability = selectedBranches.length > 0 ? selectedBranches : branches.map((b) => b.id);
        const newItem = {
          id,
          name: C.clampStr(form.name, C.LIMITS.nameMax),
          category: C.clampStr(form.category, C.LIMITS.categoryMax),
          price,
          stock,
          image: C.clampStr(form.image, C.LIMITS.imageMax),
          availability,
        };
        try {
          if (cloudConnected) await C.createCloudDoc('menuItems', id, newItem, allowedEmails);
          else setMenuItems((prev) => [...prev, newItem]);
          setForm({ name: '', category: 'BBQ', price: '', stock: '50', image: '' });
          showToast('Menu item added & synced to POS terminals!', 'success');
        } catch (err) {
          showToast('Could not add menu item to cloud.', 'error');
        }
      };

      const removeItem = async (id) => {
        try {
          if (cloudConnected) await C.deleteCloudDoc('menuItems', id);
          else setMenuItems((prev) => prev.filter((entry) => entry.id !== id));
          showToast('Menu item removed.', 'success');
        } catch (err) {
          showToast('Could not remove item.', 'error');
        }
      };

      return (
        <div className="space-y-5">
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h2 className="font-bold text-slate-900">Add Menu Item</h2>
            <form onSubmit={addItem} className="space-y-3">
              <div className="grid grid-cols-1 sm:grid-cols-6 gap-3">
                <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Dish name" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
                <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="border border-slate-200 rounded-xl p-2.5 text-sm">
                  {['BBQ', 'Karahi', 'Handi', 'Qorma', 'Rice', 'Tandoor & Breads', 'Burgers', 'Pizzas', 'Starters', 'Chinese', 'Pasta', 'Seafood', 'Deals', 'Drinks', 'Desserts'].map((category) => <option key={category}>{category}</option>)}
                </select>
                <input type="number" min="0.01" step="0.01" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} placeholder="Price (Rs.)" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
                <input type="number" min="0" step="1" value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} placeholder="Stock quantity" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
                <input type="url" value={form.image} onChange={(e) => setForm({ ...form, image: e.target.value })} placeholder="Image URL (optional)" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
                <button className="bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl p-2.5 text-sm">Add item</button>
              </div>
              <div className="flex flex-wrap items-center gap-3 text-xs text-slate-600">
                <span className="font-bold text-slate-500">Available at branches:</span>
                {branches.map((b) => (
                  <label key={b.id} className="inline-flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" checked={selectedBranches.includes(b.id)} onChange={() => toggleBranch(b.id)} className="accent-orange-500" />
                    <span>{b.name.split('-')[1]?.trim() || b.name}</span>
                  </label>
                ))}
              </div>
            </form>
          </div>
          <div className="bg-white border border-slate-200 rounded-2xl overflow-x-auto shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 text-slate-500 uppercase">
                <tr><th className="p-3">Dish</th><th className="p-3">Category</th><th className="p-3">Price</th><th className="p-3">Stock</th><th className="p-3">Availability</th><th className="p-3"></th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {menuItems.map((item) => (
                  <tr key={item.id}>
                    <td className="p-3 font-bold text-slate-900">{item.name}</td>
                    <td className="p-3">{item.category}</td>
                    <td className="p-3 font-semibold">Rs. {Number(item.price).toLocaleString()}</td>
                    <td className="p-3">{item.stock ?? 50}</td>
                    <td className="p-3">{(item.availability || []).length} branches</td>
                    <td className="p-3 text-right">
                      <button onClick={() => removeItem(item.id)} className="text-rose-600 font-bold hover:underline">Remove</button>
                    </td>
                  </tr>
                ))}
                {menuItems.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-400">No menu items yet.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: INVENTORY & STOCK CONTROL
    // ==========================================
    function InventoryModule({ inventory, setInventory, branches, selectedBranchId, showToast, cloudConnected, allowedEmails, C }) {
      const branchId = selectedBranchId !== 'all' ? selectedBranchId : branches[0]?.id || 'b1';
      const [form, setForm] = useState({ name: '', quantity: '', reorder_level: '5', unit: 'kg', branch_id: branchId });

      const addStock = async (event) => {
        event.preventDefault();
        const quantity = Number(form.quantity);
        if (!form.name.trim() || !Number.isFinite(quantity) || quantity < 0) {
          showToast('Enter an ingredient name and a valid quantity.', 'error');
          return;
        }
        const id = `stock-${Date.now()}`;
        const newInv = {
          id,
          name: C.clampStr(form.name, C.LIMITS.nameMax),
          quantity,
          reorder_level: Number(form.reorder_level) || 0,
          unit: C.clampStr(form.unit || 'units', C.LIMITS.unitMax),
          branch_id: C.sanitizeId(form.branch_id || branchId, 'b1'),
        };
        try {
          if (cloudConnected) await C.createCloudDoc('inventory', id, newInv, allowedEmails);
          else setInventory((prev) => [...prev, newInv]);
          setForm({ name: '', quantity: '', reorder_level: '5', unit: 'kg', branch_id: branchId });
          showToast('Inventory item added & synced!', 'success');
        } catch (err) {
          showToast('Could not save inventory item.', 'error');
        }
      };

      const adjustQty = async (item, delta) => {
        const nextQty = Math.max(0, Number(item.quantity || 0) + delta);
        try {
          if (cloudConnected) await C.updateCloudDoc('inventory', item.id, { quantity: nextQty });
          else setInventory((prev) => prev.map((e) => e.id === item.id ? { ...e, quantity: nextQty } : e));
        } catch (err) {
          showToast('Failed to update stock.', 'error');
        }
      };

      const removeStock = async (id) => {
        try {
          if (cloudConnected) await C.deleteCloudDoc('inventory', id);
          else setInventory((prev) => prev.filter((entry) => entry.id !== id));
          showToast('Stock item removed.', 'success');
        } catch (err) {
          showToast('Failed to delete stock item.', 'error');
        }
      };

      return (
        <div className="space-y-5">
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h2 className="font-bold text-slate-900">Inventory & Stock Control</h2>
            <form onSubmit={addStock} className="grid grid-cols-1 sm:grid-cols-6 gap-3">
              <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Ingredient / stock item" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
              <input type="number" min="0" value={form.quantity} onChange={(e) => setForm({ ...form, quantity: e.target.value })} placeholder="Quantity" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
              <input value={form.unit} onChange={(e) => setForm({ ...form, unit: e.target.value })} placeholder="Unit (kg, pcs)" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
              <input type="number" min="0" value={form.reorder_level} onChange={(e) => setForm({ ...form, reorder_level: e.target.value })} placeholder="Reorder at" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
              <select value={form.branch_id} onChange={(e) => setForm({ ...form, branch_id: e.target.value })} className="border border-slate-200 rounded-xl p-2.5 text-sm">
                {branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
              <button className="bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl p-2.5 text-sm">Add stock item</button>
            </form>
          </div>
          <div className="bg-white border border-slate-200 rounded-2xl overflow-x-auto shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 text-slate-500 uppercase">
                <tr><th className="p-3">Item</th><th className="p-3">Branch</th><th className="p-3">Quantity</th><th className="p-3">Reorder level</th><th className="p-3">Status</th><th className="p-3 text-right">Actions</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {inventory.map((item) => (
                  <tr key={item.id}>
                    <td className="p-3 font-bold text-slate-900">{item.name || item.ingredient}</td>
                    <td className="p-3">{branches.find((branch) => branch.id === item.branch_id)?.name || item.branch_id}</td>
                    <td className="p-3 font-semibold">{item.quantity} {item.unit || ''}</td>
                    <td className="p-3">{item.reorder_level}</td>
                    <td className={`p-3 font-bold ${item.quantity <= item.reorder_level ? 'text-rose-600' : 'text-emerald-600'}`}>
                      {item.quantity <= item.reorder_level ? 'Low stock' : 'In stock'}
                    </td>
                    <td className="p-3 text-right space-x-2">
                      <button type="button" onClick={() => adjustQty(item, -1)} className="px-2 py-0.5 rounded bg-slate-100 font-bold text-slate-700">-</button>
                      <button type="button" onClick={() => adjustQty(item, 1)} className="px-2 py-0.5 rounded bg-slate-100 font-bold text-slate-700">+</button>
                      <button type="button" onClick={() => removeStock(item.id)} className="text-rose-600 font-bold">Remove</button>
                    </td>
                  </tr>
                ))}
                {inventory.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-400">No inventory recorded.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: BRANCH MANAGEMENT
    // ==========================================
    function BranchManagementModule({ branches, setBranches, users, showToast, cloudConnected, allowedEmails, C }) {
      const [form, setForm] = useState({ name: '', address: '', phone: '' });

      const addBranch = async (event) => {
        event.preventDefault();
        if (!form.name.trim()) { showToast('Enter a branch name.', 'error'); return; }
        const id = `b-${Date.now()}`;
        const newB = {
          id,
          name: C.clampStr(form.name, C.LIMITS.nameMax),
          address: C.clampStr(form.address, C.LIMITS.addressMax),
          phone: C.clampStr(form.phone, C.LIMITS.phoneMax),
          status: 'Active',
        };
        try {
          if (cloudConnected) await C.createCloudDoc('branches', id, newB, allowedEmails);
          else setBranches((prev) => [...prev, newB]);
          setForm({ name: '', address: '', phone: '' });
          showToast('Branch added & synced!', 'success');
        } catch (err) {
          showToast('Only an Admin can add branches in cloud.', 'error');
        }
      };

      const toggleStatus = async (branch) => {
        const status = branch.status === 'Active' ? 'Inactive' : 'Active';
        try {
          if (cloudConnected) await C.updateCloudDoc('branches', branch.id, { status });
          else setBranches((prev) => prev.map((entry) => entry.id === branch.id ? { ...entry, status } : entry));
          showToast(`${branch.name} is now ${status.toLowerCase()}.`, 'success');
        } catch (err) {
          showToast('Only an Admin can update branch status.', 'error');
        }
      };

      return (
        <div className="space-y-5">
          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h2 className="font-bold text-slate-900">Add Branch</h2>
            <form onSubmit={addBranch} className="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Branch name" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
              <input value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} placeholder="Address" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
              <input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} placeholder="Phone" className="border border-slate-200 rounded-xl p-2.5 text-sm" />
              <button className="bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl p-2.5 text-sm">Add branch</button>
            </form>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {branches.map((branch) => (
              <div key={branch.id} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex items-center justify-between gap-4">
                <div>
                  <h3 className="font-bold text-slate-900">{branch.name}</h3>
                  <p className="text-xs text-slate-500 mt-1">{branch.address}</p>
                  <p className="text-xs text-slate-500">{branch.phone} · {users.filter((user) => user.branch_id === branch.id).length} staff</p>
                  <span className={`inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold ${branch.status === 'Active' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>{branch.status}</span>
                </div>
                <button onClick={() => toggleStatus(branch)} className="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">
                  {branch.status === 'Active' ? 'Deactivate' : 'Activate'}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Bootstrap() {
      const [ready, setReady] = useState(Boolean(window.__CLOUD__));
      useEffect(() => {
        if (window.__CLOUD__) { setReady(true); return; }
        const onReady = () => setReady(true);
        window.addEventListener('cloud-ready', onReady);
        const fallbackTimer = setTimeout(() => {
          if (!window.__CLOUD__) {
            window.__CLOUD__ = {
              cloudAvailable: false,
              auth: { currentUser: null },
              LOGO_URL: './images/logo.jpg',
              DEFAULT_DISH_IMAGE_URL: './images/default-dish.jpg',
              DEFAULT_AVATAR_URL: './images/default-avatar.jpg',
              fallbackImgSrc: (event) => {
                const img = event?.currentTarget;
                if (!img || img.dataset.fbPublic) return;
                img.dataset.fbPublic = '1';
                const raw = img.getAttribute('src') || '';
                if (raw.startsWith('./images/')) img.setAttribute('src', raw.replace('./images/', './public/images/'));
              },
              INITIAL_BRANCHES: [
                { id: 'b1', name: 'Royal India By Spicy Twist - Gulberg Main', address: 'Main Boulevard, Gulberg III, Lahore', phone: '+92 42 111-987-654', status: 'Active' },
              ],
              INITIAL_USERS: [
                { id: 'u1', name: 'Zuraiz Owner', role: 'Super Admin', branch_id: 'all', email: 'owner@zuraizspecial.com', avatar: './images/default-avatar.jpg', phone: '+92 300 1234567', status: 'Active', hourly_rate: 1200 },
              ],
              INITIAL_CUSTOMERS: [],
              INITIAL_GIFT_CARDS: [],
              INITIAL_PROMOS: [],
              INITIAL_RESERVATIONS: [],
              INITIAL_SHIFTS: [],
              INITIAL_ATTENDANCE: [],
              INITIAL_RECIPES: [],
              INITIAL_VOID_LOGS: [],
              INITIAL_WASTE_LOGS: [],
              INITIAL_REGISTER: { id: 'main', isOpen: true, openingBalance: 10000, currentCash: 10000, cashDrops: [] },
              normalizeAllowedEmails: (list) => Array.from(new Set((list || []).filter(Boolean))),
              onAuthStateChanged: (_a, cb) => { cb(null); return () => {}; },
              signInWithPopup: async () => { throw new Error('Cloud sync unavailable right now.'); },
              signInWithEmailAndPassword: async () => { throw new Error('Cloud Auth unavailable right now.'); },
              signOut: async () => {},
              createCloudDoc: async () => {},
              updateCloudDoc: async () => {},
              deleteCloudDoc: async () => {},
              upsertCashRegister: async () => {},
              authorizeStaffEmail: async () => {},
              revokeStaffEmail: async () => {},
              syncAllowedEmailsAcrossCollections: async () => {},
              seedInitialCloudDataIfEmpty: async () => false,
              restoreBackupToFirestore: async () => {},
            };
          }
          setReady(true);
        }, 3000);
        return () => {
          window.removeEventListener('cloud-ready', onReady);
          clearTimeout(fallbackTimer);
        };
      }, []);

      if (!ready) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-white">
            <p className="text-xs font-bold tracking-wider uppercase text-orange-300">Loading Royal India By Spicy Twist...</p>
          </div>
        );
      }
      return <App />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Bootstrap />);
  </script>
</body>
</html>
