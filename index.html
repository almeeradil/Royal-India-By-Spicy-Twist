    function fallbackImgSrc(event) {
      const img = event?.currentTarget;
      if (!img || img.dataset.fbPublic) return;
      img.dataset.fbPublic = '1';
      const raw = img.getAttribute('src') || '';
      if (raw.startsWith('./images/')) {
        img.setAttribute('src', raw.replace('./images/', './public/images/'));
      } else if (raw.startsWith('/images/')) {
        img.setAttribute('src', '.' + '/public' + raw);
      }
    }

    let signInWithCredential = async () => { throw new Error('Cloud sync unavailable in offline/static mode.'); };

      void authMod.getRedirectResult(auth).catch((redirErr) => {

      console.warn('Cloud SDK bootstrap fell back to local mode:', bootErr);
    }

    const OperationType = {
      CREATE: 'create',
      UPDATE: 'update',
      DELETE: 'delete',
      LIST: 'list',
      GET: 'get',
      WRITE: 'write',
    };

    function handleFirestoreError(error, operationType, path) {
      const errInfo = {
        error: error instanceof Error ? error.message : String(error),
        authInfo: {
          userId: auth.currentUser?.uid || null,
          email: auth.currentUser?.email || null,
          emailVerified: auth.currentUser?.emailVerified ?? null,
          isAnonymous: auth.currentUser?.isAnonymous ?? null,
          tenantId: auth.currentUser?.tenantId || null,
          providerInfo: (auth.currentUser?.providerData || []).map((p) => ({
            providerId: p.providerId,
            email: p.email,
          })),
        },
        operationType,
        path,
      };
      console.error('Firestore Error: ', JSON.stringify(errInfo));
      throw new Error(JSON.stringify(errInfo));
    }

    async function testConnection() {
      if (!cloudAvailable || !db) return { ok: false, offline: true, message: 'Static offline mode' };
      try {
        await getDocFromServer(doc(db, 'test', 'connection'));
        return { ok: true, offline: false };
      } catch (error) {
        const msg = error instanceof Error ? error.message : String(error);
        if (msg.includes('the client is offline')) {
          console.error('Please check your Firebase configuration.', msg);
          return { ok: false, offline: true, message: msg };
        }
        return { ok: true, offline: false, message: msg };
      }
    }
    if (cloudAvailable) void testConnection();

    async function signInWithGooglePopup() {
      if (!cloudAvailable || !GoogleAuthProviderClass) {
        throw new Error('Cloud Auth unavailable right now.');
      }
      const provider = new GoogleAuthProviderClass();
      provider.setCustomParameters({ prompt: 'select_account' });
      return signInWithPopup(auth, provider);
    }

    async function signInWithGoogleRedirect() {
      if (!cloudAvailable || !GoogleAuthProviderClass) {
        throw new Error('Cloud Auth unavailable right now.');
      }
      const provider = new GoogleAuthProviderClass();
      provider.setCustomParameters({ prompt: 'select_account' });
      return signInWithRedirect(auth, provider);
    }

    function signInWithGoogleGIS() {
      return new Promise((resolve, reject) => {
        if (!cloudAvailable || !GoogleAuthProviderClass) {
          reject(new Error('Cloud Auth unavailable right now.'));
          return;
        }
        const oauth2 = window.google?.accounts?.oauth2;
        if (!oauth2 || !firebaseConfig.oAuthClientId) {
          reject(new Error('Google Identity Services script is still loading or blocked.'));
          return;
        }
        try {
          const client = oauth2.initTokenClient({
            client_id: firebaseConfig.oAuthClientId,
            scope: 'openid email profile',
            prompt: 'select_account',
            callback: async (tokenResponse) => {
              if (!tokenResponse || tokenResponse.error || !tokenResponse.access_token) {
                reject(new Error(tokenResponse?.error_description || tokenResponse?.error || 'Google sign-in did not return an access token.'));
                return;
              }
              try {
                const credential = GoogleAuthProviderClass.credential(null, tokenResponse.access_token);
                const userCred = await signInWithCredential(auth, credential);
                resolve(userCred);
              } catch (credErr) {
                reject(credErr);
              }
            },
            error_callback: (err) => {
              const errType = err?.type || 'popup_failed';
              reject(new Error(errType === 'popup_closed' ? 'auth/popup-closed-by-user' : `Google OAuth (${errType})`));
            },
          });
          client.requestAccessToken();
        } catch (initErr) {
          reject(initErr);
        }
      });
    }

    async function syncEntityToSql(entity, id, payload) {
      try {
        const user = auth?.currentUser;
        if (!user) return;
        const token = await user.getIdToken();
        await fetch('./api/sql/entity', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ entity, id, payload }),
        });
      } catch (_) {
        // Ignore when running on static hosting without backend server
      }
    }

    async function deleteEntityFromSql(entity, id) {
      try {
        const user = auth?.currentUser;
        if (!user) return;
        const token = await user.getIdToken();
        await fetch(`./api/sql/entity/${encodeURIComponent(entity)}/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` },
        });
      } catch (_) {
        // Ignore when running on static hosting without backend server
      }
    }

    const LIMITS = {
      idMax: 128,
      nameMax: 150,
      shortNameMax: 120,
      addressMax: 300,
      phoneMax: 40,
      emailMax: 160,
      categoryMax: 80,
      imageMax: 500,
      notesMax: 300,
      feedbackMax: 500,
      tableMax: 40,
      orderNumberMax: 32,
      unitMax: 30,
      qtyStrMax: 50,
      dateMax: 32,
      dateTimeStrMax: 64,
      codeMax: 64,
      promoCodeMax: 40,
      roleMax: 60,
      maxAllowedEmails: 20,
      maxAvailability: 50,
      maxOrderItems: 50,
      maxRecipeIngredients: 30,
      maxCashDrops: 100,
    };

    function sanitizeId(raw, prefix = 'doc') {
      const cleaned = String(raw || '')
        .trim()
        .replace(/[^a-zA-Z0-9_-]/g, '-')
        .slice(0, LIMITS.idMax);
      return cleaned || `${prefix}-${Date.now()}`;
    }

    function clampStr(raw, maxLen) {
      return String(raw ?? '').trim().slice(0, maxLen);
    }

    function clampNum(raw, min = 0, max = 100000000) {
      const num = Number(raw);
      if (!Number.isFinite(num)) return min;
      return Math.min(max, Math.max(min, num));
    }

    function normalizeAllowedEmails(emails) {
      const unique = Array.from(
        new Set(
          (emails || [])
            .map((e) => String(e || '').trim().toLowerCase())
            .filter((e) => e.length >= 3 && e.length <= LIMITS.emailMax)
        )
      );
      return unique.slice(0, LIMITS.maxAllowedEmails);
    }

    function requireUid() {
      const uid = auth.currentUser?.uid;
      if (!uid) throw new Error('Authentication required to write to cloud database.');
      return uid;
    }

    async function createCloudDoc(colName, id, payload, allowedEmails, options = { hasUpdatedAt: true }) {
      const cleanId = sanitizeId(id, colName.slice(0, 4));
      if (!cloudAvailable || !db) return;
      const ownerUid = requireUid();
      const emails = normalizeAllowedEmails(allowedEmails);
      const data = {
        ...payload,
        id: cleanId,
        ownerUid,
        allowedEmails: emails,
        createdAt: serverTimestamp(),
      };
      if (options.hasUpdatedAt !== false) {
        data.updatedAt = serverTimestamp();
      }
      try {
        await setDoc(doc(db, colName, cleanId), data);
        void syncEntityToSql(colName, cleanId, payload);
      } catch (error) {
        handleFirestoreError(error, OperationType.CREATE, `${colName}/${cleanId}`);
      }
    }

    async function updateCloudDoc(colName, id, updates) {
      const cleanId = sanitizeId(id, colName.slice(0, 4));
      if (!cloudAvailable || !db) return;
      try {
        await updateDoc(doc(db, colName, cleanId), {
          ...updates,
          updatedAt: serverTimestamp(),
        });
        void syncEntityToSql(colName, cleanId, updates);
      } catch (error) {
        handleFirestoreError(error, OperationType.UPDATE, `${colName}/${cleanId}`);
      }
    }

    async function deleteCloudDoc(colName, id) {
      const cleanId = sanitizeId(id, colName.slice(0, 4));
      if (!cloudAvailable || !db) return;
      try {
        await deleteDoc(doc(db, colName, cleanId));
        void deleteEntityFromSql(colName, cleanId);
      } catch (error) {
        handleFirestoreError(error, OperationType.DELETE, `${colName}/${cleanId}`);
      }
    }

    async function upsertCashRegister(registerId, payload, allowedEmails, existsInCloud) {
      const cleanId = sanitizeId(registerId, 'reg');
      if (!cloudAvailable || !db) return;
      const cleanPayload = {
        isOpen: Boolean(payload.isOpen),
        openingBalance: clampNum(payload.openingBalance, 0),
        currentCash: clampNum(payload.currentCash, 0),
        cashDrops: (payload.cashDrops || []).slice(0, LIMITS.maxCashDrops).map((d) => ({
          id: Number(d.id) || Date.now(),
          amount: clampNum(d.amount, 0),
          time: clampStr(d.time, LIMITS.phoneMax),
          note: clampStr(d.note || '', LIMITS.shortNameMax),
        })),
        updatedAt: serverTimestamp(),
      };
      try {
        if (existsInCloud) {
          await updateDoc(doc(db, 'registers', cleanId), cleanPayload);
        } else {
          await setDoc(doc(db, 'registers', cleanId), {
            id: cleanId,
            ...cleanPayload,
            ownerUid: requireUid(),
            allowedEmails: normalizeAllowedEmails(allowedEmails),
          });
        }
        void syncEntityToSql('registers', cleanId, {
          isOpen: cleanPayload.isOpen,
          openingBalance: cleanPayload.openingBalance,
          currentCash: cleanPayload.currentCash,
          cashDrops: cleanPayload.cashDrops,
        });
      } catch (error) {
        handleFirestoreError(
          error,
          existsInCloud ? OperationType.UPDATE : OperationType.CREATE,
          `registers/${cleanId}`
        );
      }
    }

    async function authorizeStaffEmail(email, name, role) {
      const cleanEmail = clampStr(email.toLowerCase(), LIMITS.emailMax);
      const uid = requireUid();
      try {
        await setDoc(doc(db, 'authorizedStaff', cleanEmail), {
          email: cleanEmail,
          name: clampStr(name, LIMITS.shortNameMax),
          role,
          addedByUid: uid,
          createdAt: serverTimestamp(),
        });
      } catch (error) {
        handleFirestoreError(error, OperationType.CREATE, `authorizedStaff/${cleanEmail}`);
      }
    }

    async function revokeStaffEmail(email) {
      const cleanEmail = clampStr(email.toLowerCase(), LIMITS.emailMax);
      try {
        await deleteDoc(doc(db, 'authorizedStaff', cleanEmail));
      } catch (error) {
        handleFirestoreError(error, OperationType.DELETE, `authorizedStaff/${cleanEmail}`);
      }
    }

    const SHARED_COLLECTIONS = [
      'branches', 'staffUsers', 'menuItems', 'orders', 'inventory',
      'customers', 'giftCards', 'promos', 'reservations', 'shifts',
      'attendance', 'recipes', 'voidLogs', 'wasteLogs', 'registers',
    ];

    async function syncAllowedEmailsAcrossCollections(emails) {
      const normalized = normalizeAllowedEmails(emails);
      const refs = [];
      for (const colName of SHARED_COLLECTIONS) {
        try {
          const snap = await getDocs(collection(db, colName));
          for (const docSnap of snap.docs) refs.push(docSnap.ref);
        } catch (error) {
          handleFirestoreError(error, OperationType.LIST, colName);
        }
      }
      for (let i = 0; i < refs.length; i += 400) {
        const chunk = refs.slice(i, i + 400);
        const batch = writeBatch(db);
        for (const ref of chunk) batch.update(ref, { allowedEmails: normalized });
        try {
          await batch.commit();
        } catch (error) {
          handleFirestoreError(error, OperationType.UPDATE, 'allowedEmailsSync');
        }
      }
    }

    function playKitchenChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (_) {}
    }

      const [registerState, setRegisterState] = useState(C.INITIAL_REGISTER);
      const [registerExistsInCloud, setRegisterExistsInCloud] = useState(false);
      const [authorizedStaffList, setAuthorizedStaffList] = useState([]);
      const [kdsSoundEnabled, setKdsSoundEnabled] = useState(true);

      const backupFileInputRef = useRef(null);
      const [restoreMessage, setRestoreMessage] = useState('');
      const [pendingRestoreData, setPendingRestoreData] = useState(null);
      const [showZReportModal, setShowZReportModal] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [notifications, setNotifications] = useState([
        { id: 1, title: 'Royal India By Spicy Twist System Online', msg: 'All PKR (Rs.) reporting and multi-branch tools ready!', time: 'Just now', unread: true }
      ]);
      const [showNotifDropdown, setShowNotifDropdown] = useState(false);
      const [receiptModalOrder, setReceiptModalOrder] = useState(null);

      const prevOrderIdsRef = useRef(null);
      const cloudConnected = Boolean(firebaseUser && firebaseUser.emailVerified);

      const allowedEmails = useMemo(() => {
        const list = authorizedStaffList.map((s) => s.email);
        if (firebaseUser?.email) list.push(firebaseUser.email);
        return C.normalizeAllowedEmails(list);
      }, [authorizedStaffList, firebaseUser]);

      useEffect(() => {
        setMobileNavOpen(false);
      }, [activeTab]);

      const showToast = (message, type = 'success') => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3500);
      };

      // --- FIREBASE AUTH LISTENER ---
      useEffect(() => {
        const safetyTimer = setTimeout(() => setAuthChecked(true), 2500);
        const unsub = C.onAuthStateChanged(C.auth, (user) => {
          clearTimeout(safetyTimer);
          setFirebaseUser(user);
          setAuthChecked(true);
          if (user && user.emailVerified) {
            setIsAuthenticated(true);
          }
        });
        return () => {
          clearTimeout(safetyTimer);
          if (typeof unsub === 'function') unsub();
        };
      }, []);

      // --- CLOUD REAL-TIME LISTENERS ---
      useEffect(() => {
        if (!firebaseUser || !firebaseUser.emailVerified) return;

        let cancelled = false;
        const unsubs = [];

        const initAndSubscribe = async () => {
          try {
            setCloudError('');
            const ownerEmail = (firebaseUser.email || '').toLowerCase();
            if (pendingRestoreData) {
              await C.restoreBackupToFirestore(pendingRestoreData, firebaseUser.uid, ownerEmail ? [ownerEmail] : []);
              if (!cancelled) {
                setPendingRestoreData(null);
                showToast('Backup uploaded and synced to AI Studio Cloud!', 'success');
              }
            } else {
              await C.seedInitialCloudDataIfEmpty(firebaseUser.uid, ownerEmail ? [ownerEmail] : []);
            }
          } catch (err) {
            if (!cancelled) {
              setCloudError('Cloud sync initialization warning: verify this Google account is authorized.');
            }
          }

          if (cancelled) return;

          const subCol = (colName, setter, sortFn) => {
            const unsub = C.onSnapshot(
              C.collection(C.db, colName),
              (snap) => {
                const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                if (sortFn) list.sort(sortFn);
                setter(list);
              },
              (err) => {
                console.error(`Snapshot error (${colName}):`, err.message);
              }
            );
            unsubs.push(unsub);
          };

          subCol('branches', (list) => { if (list.length > 0) setBranches(list); });
          subCol('staffUsers', (list) => {
            if (list.length > 0) {
              setUsers(list);
              setCurrentUser((prev) => list.find((u) => u.id === prev.id) || list[0]);
            }
          });
          subCol('menuItems', setMenuItems);
          subCol(
            'orders',
            (list) => {
              if (prevOrderIdsRef.current !== null) {
                const newIncoming = list.filter(
                  (o) => !prevOrderIdsRef.current.has(o.id) && o.status === 'New Orders'
                );
                if (newIncoming.length > 0) {
                  if (kdsSoundEnabled) playKitchenChime();
                  setNotifications((prev) => [
                    {
                      id: Date.now(),
                      title: `New Kitchen Order ${newIncoming[0].order_number}`,
                      msg: `${newIncoming[0].order_type} · ${newIncoming[0].table_number} — Rs. ${Number(newIncoming[0].total_amount || 0).toLocaleString()}`,
                      time: 'Just now',
                      unread: true,
                    },
                    ...prev.slice(0, 19),
                  ]);
                }
              }
              prevOrderIdsRef.current = new Set(list.map((o) => o.id));
              setOrdersState(list);
            },
            (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || ''))
          );
          subCol('inventory', setInventory);
          subCol('customers', setCustomers);
          subCol('giftCards', setGiftCards);
          subCol('promos', setPromos);
          subCol('reservations', setReservations);
          subCol('shifts', setShifts);
          subCol('attendance', setAttendance);
          subCol('recipes', setRecipes);
          subCol('voidLogs', setVoidLogs);
          subCol('wasteLogs', setWasteLogs);
          subCol('authorizedStaff', setAuthorizedStaffList);

          const unsubReg = C.onSnapshot(
            C.collection(C.db, 'registers'),
            (snap) => {
              const mainDoc = snap.docs.find((d) => d.id === 'main') || snap.docs[0];
              if (mainDoc) {
                setRegisterExistsInCloud(true);
                setRegisterState({ id: mainDoc.id, ...mainDoc.data() });
              } else {
                setRegisterExistsInCloud(false);
              }
            },
            (err) => console.error('Snapshot error (registers):', err.message)
          );
          unsubs.push(unsubReg);
        };

        void initAndSubscribe();

        return () => {
          cancelled = true;
          unsubs.forEach((u) => u());
        };
      }, [firebaseUser?.uid, firebaseUser?.emailVerified]);

      const setOrders = (update) => {
        setOrdersState((previousOrders) => typeof update === 'function' ? update(previousOrders) : update);
      };

      const getBackupData = () => ({
        branches, users, menuItems, orders, inventory, customers, giftCards, promos,
        reservations, shifts, attendance, recipes, voidLogs, wasteLogs, registerState,
        selectedBranchId, currentUserId: currentUser.id,
      });

      const handleExportBackup = () => {
        const backup = { app: 'Royal India By Spicy Twist', version: 1, exportedAt: new Date().toISOString(), data: getBackupData() };
        const file = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.href = url;
        link.download = `royal-india-backup-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('JSON backup downloaded successfully.', 'success');
      };

      const handleRestoreBackup = async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const backup = JSON.parse(await file.text());
          const data = backup?.version === 1 ? backup.data : null;
          if (!data || !BACKUP_ARRAY_KEYS.every((key) => Array.isArray(data[key])) || !data.registerState || !Array.isArray(data.registerState.cashDrops)) {
            throw new Error('Invalid backup structure');
          }
          setBranches(data.branches);
          setUsers(data.users);
          setMenuItems(data.menuItems);
          setOrdersState(data.orders);
          setInventory(data.inventory);
          setCustomers(data.customers);
          setGiftCards(data.giftCards);
          setPromos(data.promos);
          setReservations(data.reservations);
          setShifts(data.shifts);
          setAttendance(data.attendance);
          setRecipes(data.recipes);
          setVoidLogs(data.voidLogs);
          setWasteLogs(data.wasteLogs);
          setRegisterState(data.registerState);
          setSelectedBranchId(data.selectedBranchId || 'all');
          const restoredUser = data.users.find((u) => u.id === data.currentUserId);
          if (restoredUser) setCurrentUser(restoredUser);

          if (firebaseUser && firebaseUser.emailVerified) {
            await C.restoreBackupToFirestore(data, firebaseUser.uid, allowedEmails);
            setRestoreMessage('Backup restored and uploaded to Cloud Firestore!');
          } else {
            setPendingRestoreData(data);
            setRestoreMessage('Backup loaded! Sign in with Google Cloud Sync to push it to all laptops.');
          }
          setLoginError('');
        } catch (error) {
          setRestoreMessage('');
          setLoginError('Could not restore this file. Please choose a valid Royal India JSON backup.');
        }
        event.target.value = '';
      };

      const filteredOrders = useMemo(() => {
        if (selectedBranchId === 'all') return orders;
        return orders.filter((o) => o.branch_id === selectedBranchId);
      }, [orders, selectedBranchId]);

      const filteredInventory = useMemo(() => {
        if (selectedBranchId === 'all') return inventory;
        return inventory.filter((i) => i.branch_id === selectedBranchId);
      }, [inventory, selectedBranchId]);

      const filteredMenu = useMemo(() => {
        if (selectedBranchId === 'all') return menuItems;
        return menuItems.filter((m) => m.availability && m.availability.includes(selectedBranchId));
      }, [menuItems, selectedBranchId]);

      const markNotificationsRead = () => {
        setNotifications((prev) => prev.map((n) => ({ ...n, unread: false })));
      };

      const handleGoogleAuthSuccess = (result) => {
        if (result?.user) {
          setFirebaseUser(result.user);
        }
        setGoogleAuthIssue(null);
        setLoginError('');
        setIsAuthenticated(true);
        showToast('Google Cloud Sync connected across laptops!', 'success');
      };

      const handleGoogleAuthFailure = (err) => {
        const code = err?.code || '';
        const rawMsg = err instanceof Error ? err.message : String(err || 'Google sign-in failed.');
        const hostname = typeof window !== 'undefined' ? window.location.hostname : '';
        const isEmbedded = typeof window !== 'undefined' && window.self !== window.top;
        console.error('Google Sign-In Error:', code, rawMsg);

        if (code === 'auth/unauthorized-domain' || rawMsg.includes('unauthorized-domain')) {
          setGoogleAuthIssue({
            type: 'unauthorized-domain',
            code: code || 'auth/unauthorized-domain',
            hostname,
            title: 'Domain Not Authorized for Google Sign-In',
            detail: `Current domain "${hostname}" is not in Firebase Authorized Domains yet. Copy "${hostname}" and add it in Firebase Console → Authentication → Settings → Authorized domains, OR open the live AI Studio app URL.`,
          });
        } else if (
          code === 'auth/popup-closed-by-user' ||
          code === 'auth/cancelled-popup-request' ||
          code === 'auth/popup-blocked' ||
          code === 'auth/internal-error' ||
          rawMsg.includes('popup-closed') ||
          rawMsg.includes('popup_closed')
        ) {
          setGoogleAuthIssue({
            type: 'popup-closed',
            code: code || 'auth/popup-closed-by-user',
            hostname,
            isEmbedded,
            title: 'Google Popup Closed Before Completing',
            detail: isEmbedded
              ? 'This preview runs inside an embedded frame where Chrome may block cross-site sign-in popups. Click "Open App in Full Tab" below and sign in with Google there.'
              : 'Your browser closed or blocked the sign-in popup window. Click "Google Redirect Login" below (no popup needed) or allow popups for this site.',
          });
        } else {
          setGoogleAuthIssue({
            type: 'other',
            code: code || 'auth/error',
            hostname,
            isEmbedded,
            title: 'Google Sign-In Error',
            detail: rawMsg,
          });
        }
      };

      const handleGoogleLogin = async () => {
        setCloudBusy(true);
        setLoginError('');
        setGoogleAuthIssue(null);
        try {
          const result = await (C.signInWithGooglePopup
            ? C.signInWithGooglePopup()
            : C.signInWithPopup(C.auth, C.googleProvider));
          handleGoogleAuthSuccess(result);
        } catch (err) {
          handleGoogleAuthFailure(err);
        } finally {
          setCloudBusy(false);
        }
      };

      const handleGoogleFirebasePopup = async () => {
        setCloudBusy(true);
        setLoginError('');
        setGoogleAuthIssue(null);
        try {
          const result = await C.signInWithGooglePopup();
          handleGoogleAuthSuccess(result);
        } catch (err) {
          handleGoogleAuthFailure(err);
        } finally {
          setCloudBusy(false);
        }
      };

      const handleGoogleRedirectLogin = async () => {
        setCloudBusy(true);
        setLoginError('');
        try {
          await C.signInWithGoogleRedirect();
        } catch (err) {
          handleGoogleAuthFailure(err);
          setCloudBusy(false);
        }
      };

      const handleLogin = async (event) => {
        event.preventDefault();
        const email = loginEmail.trim().toLowerCase();
        const password = loginPassword;
        if (!email || !password) {
          setLoginError('Email or password is incorrect. Please try again.');
          return;
        }
        setCloudBusy(true);
        setLoginError('');

        // Try Firebase Email/Password sign-in first if configured
        try {
          await C.signInWithEmailAndPassword(C.auth, email, password);
          setIsAuthenticated(true);
          setLoginPassword('');
          setCloudBusy(false);
          return;
        } catch (_) {
          // Fall back to standard administrator credentials specified by user
        }

        if (email === 'admin@gmail.com' && password === 'aefaefzefzef') {
          setIsAuthenticated(true);
          setLoginError('');
          setLoginPassword('');
          setCloudBusy(false);
          return;
        }

        setLoginError('Email or password is incorrect. Please try again.');
        setLoginPassword('');
        setCloudBusy(false);
      };

      const handleLogout = async () => {
        try {
          if (C.auth.currentUser) await C.signOut(C.auth);
        } catch (_) {}
        prevOrderIdsRef.current = null;
        setIsAuthenticated(false);
        setLoginEmail('');
        setLoginPassword('');
        setLoginError('');
      };

      // --- CLOUD WRITE HELPERS (fallback cleanly to local state if Google Cloud isn't connected yet) ---
      const cloudProps = {
        cloudConnected,
        firebaseUser,
        allowedEmails,
        authorizedStaffList,
        C,
      };

      if (!authChecked) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-white">
            <div className="flex flex-col items-center gap-3">
              <div className="h-12 w-12 rounded-2xl bg-orange-500 flex items-center justify-center overflow-hidden shadow-lg shadow-orange-500/30 animate-pulse">
                <img src={C.LOGO_URL} onError={C.fallbackImgSrc} alt="Royal India By Spicy Twist" className="h-full w-full object-cover" />
              </div>
              <p className="text-xs font-bold tracking-wider uppercase text-orange-300">Connecting to AI Studio Cloud...</p>
            </div>
          </div>
        );

      if (!isAuthenticated) {
        return (
          <div className="fixed inset-0 z-40 bg-slate-950 flex items-start sm:items-center justify-center p-4 sm:p-8 overflow-y-auto">
            <div className="w-full max-w-5xl my-auto overflow-hidden rounded-3xl bg-white shadow-2xl lg:grid lg:grid-cols-2">
              <section className="relative hidden min-h-[600px] flex-col justify-between overflow-hidden bg-gradient-to-br from-orange-500 via-orange-600 to-rose-700 p-10 text-white lg:flex">
                <div className="absolute -right-24 -top-24 h-80 w-80 rounded-full border-[40px] border-white/10"></div>
                <div className="absolute -bottom-28 -left-20 h-80 w-80 rounded-full bg-white/10 blur-2xl"></div>
                <div className="relative flex items-center gap-3">
                  <div className="flex h-12 w-12 items-center justify-center overflow-hidden rounded-2xl bg-white/15">
                    <img src={C.LOGO_URL} onError={C.fallbackImgSrc} alt="Royal India By Spicy Twist logo" className="h-full w-full object-cover" />
                  </div>
                  <div>
                    <p className="font-extrabold tracking-wide">ROYAL INDIA BY SPICY TWIST</p>
                    <p className="text-xs text-orange-100">Restaurant management · Cloud Sync</p>
                  </div>
                </div>
                <div className="relative max-w-md">
                  <p className="mb-4 text-xs font-bold uppercase tracking-[0.25em] text-orange-100">Welcome back</p>
                  <h1 className="text-4xl font-extrabold leading-tight">Everything your restaurant needs, in one place.</h1>
                  <p className="mt-5 text-sm leading-6 text-orange-50">Manage orders, branches, staff and real-time Kitchen Display sync across Waiter, Cashier and Chef laptops.</p>
                </div>
                <p className="relative text-xs text-orange-100">AI Studio Cloud Firestore · Multi-branch operations · PKR reporting</p>
              </section>

              <section className="flex min-h-[600px] flex-col justify-center px-6 py-10 sm:px-12 lg:px-14">
                <div className="mb-8 lg:hidden">
                  <div className="flex h-12 w-12 items-center justify-center overflow-hidden rounded-2xl bg-orange-500 shadow-lg shadow-orange-500/25">
                    <img src={C.LOGO_URL} onError={C.fallbackImgSrc} alt="Royal India By Spicy Twist logo" className="h-full w-full object-cover" />
                  </div>
                  <p className="mt-4 text-xs font-bold uppercase tracking-[0.2em] text-orange-600">Royal India By Spicy Twist</p>
                </div>
                <div className="mb-6">
                  <p className="text-sm font-semibold text-orange-600">ADMIN PORTAL</p>
                  <h2 className="mt-2 text-3xl font-extrabold tracking-tight text-slate-900">Sign in to your account</h2>
                  <p className="mt-2 text-sm text-slate-500">Use Google Cloud Sync for live multi-laptop POS → Kitchen sync, or sign in with administrator credentials.</p>
                </div>

                <button

                  disabled={cloudBusy}
                  onClick={handleGoogleLogin}
                  className="mb-3 flex w-full items-center justify-center gap-2.5 rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-bold text-slate-800 shadow-sm transition hover:border-orange-400 hover:bg-orange-50 disabled:opacity-60"
                >
                  <Icon name="cloud" className="w-4 h-4 text-orange-600" />
                  {cloudBusy ? 'Connecting to Cloud...' : 'Sign in with Google (Live Multi-Laptop Sync)'}
                </button>

                {googleAuthIssue && (
                  <div role="alert" className="mb-4 rounded-xl border border-amber-200 bg-amber-50 p-3.5 text-xs text-amber-900 space-y-2.5">
                    <div className="flex items-center justify-between gap-2">
                      <p className="font-bold text-amber-950">{googleAuthIssue.title}</p>
                      {googleAuthIssue.code && (
                        <span className="rounded bg-amber-200/70 px-1.5 py-0.5 font-mono text-[10px] text-amber-950">{googleAuthIssue.code}</span>
                      )}
                    </div>
                    <p className="leading-relaxed text-amber-800">{googleAuthIssue.detail}</p>
                    <div className="flex flex-wrap gap-2">
                      {googleAuthIssue.type === 'unauthorized-domain' ? (
                        <>
                          <button
                            type="button"
                            onClick={() => {
                              if (googleAuthIssue.hostname && navigator.clipboard) {
                                navigator.clipboard.writeText(googleAuthIssue.hostname);
                              }
                            }}
                            className="rounded-lg border border-amber-300 bg-white px-3 py-1.5 font-bold text-amber-900 hover:bg-amber-100 transition"
                          >
                            Copy "{googleAuthIssue.hostname}"
                          </button>
                          <a
                            href={`https://console.firebase.google.com/project/${C.projectId || 'prismatic-edition-ntvkm'}/authentication/settings`}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-1.5 rounded-lg bg-orange-500 px-3 py-1.5 font-bold text-white hover:bg-orange-600 transition"
                          >
                            Open Firebase Authorized Domains
                          </a>
                          <a
                            href="https://ais-pre-dunm2vf2yybsxriiffmio7-596917347340.asia-east1.run.app"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-1.5 rounded-lg border border-amber-300 bg-white px-3 py-1.5 font-bold text-amber-900 hover:bg-amber-100 transition"
                          >
                            Open Authorized App Link
                          </a>
                        </>
                      ) : (
                        <>
                          {typeof window !== 'undefined' && window.self !== window.top ? (
                            <a
                              href={typeof window !== 'undefined' ? window.location.href : '#'}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="inline-flex items-center rounded-lg bg-orange-500 px-3 py-1.5 font-bold text-white hover:bg-orange-600 transition"
                            >
                              Open App in Full Tab
                            </a>
                          ) : (
                            <button
                              type="button"
                              disabled={cloudBusy}
                              onClick={handleGoogleRedirectLogin}
                              className="rounded-lg bg-orange-500 px-3 py-1.5 font-bold text-white hover:bg-orange-600 transition"
                            >
                              Google Redirect Login (No Popup)
                            </button>
                          )}
                          <button
                            type="button"
                            disabled={cloudBusy}
                            onClick={handleGoogleFirebasePopup}
                            className="rounded-lg border border-amber-300 bg-white px-3 py-1.5 font-bold text-amber-900 hover:bg-amber-100 transition"
                          >
                            Retry Google Popup
                          </button>
                        </>
                      )}
                    </div>
                  </div>
                )}

                <div className="relative mb-5 mt-2 flex items-center">
                  <div className="flex-grow border-t border-slate-200"></div>
                  <span className="mx-3 flex-shrink text-[11px] font-bold uppercase tracking-wider text-slate-400">Or Admin Credentials</span>
                  <div className="flex-grow border-t border-slate-200"></div>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label htmlFor="login-email" className="mb-1.5 block text-sm font-semibold text-slate-700">Email address</label>
                    <input
                      id="login-email"
                      type="email"
                      autoComplete="username"
                      required
                      value={loginEmail}
                      onChange={(event) => setLoginEmail(event.target.value)}
                      placeholder="admin@gmail.com"
                      className="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-100"
                    />
                  </div>
                  <div>
                    <label htmlFor="login-password" className="mb-1.5 block text-sm font-semibold text-slate-700">Password</label>
                    <input
                      id="login-password"
                      type="password"
                      autoComplete="current-password"
                      required
                      value={loginPassword}
                      onChange={(event) => setLoginPassword(event.target.value)}
                      placeholder="Enter your password"
                      className="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-100"
                    />
                  </div>
                  {loginError && <p role="alert" className="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700">{loginError}</p>}
                  <button
                    type="submit"
                    disabled={cloudBusy}
                    className="w-full rounded-xl bg-orange-500 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-orange-500/25 transition hover:bg-orange-600 focus:outline-none focus:ring-4 focus:ring-orange-200 disabled:opacity-60"
                  >
                    Sign in securely
                  </button>
                </form>

                <input ref={backupFileInputRef} type="file" accept=".json,application/json" onChange={handleRestoreBackup} className="hidden" />
                <button
                  type="button"
                  onClick={() => backupFileInputRef.current?.click()}
                  className="mt-4 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-bold text-slate-700 transition hover:border-orange-400 hover:bg-orange-50"
                >
                  Restore data from JSON backup
                </button>
                {restoreMessage && <p role="status" className="mt-3 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">{restoreMessage}</p>}
                <p className="mt-6 text-center text-xs text-slate-400">Authorized administrator access only</p>
              </section>
            </div>
          </div>
        );
      }

      return (

    // ==========================================
    // MODULE 1: DASHBOARD OVERVIEW (8 KPI CARDS + 8 ANALYTICAL CHARTS)
    // ==========================================
    function DashboardModule({ orders, inventory, branches, selectedBranchId, menuItems, onExportBackup, cloudConnected }) {
      const activeOrders = orders.filter((o) => o.status !== 'Cancelled');
      const totalRevenue = activeOrders.reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
      const totalOrders = orders.length;
      const activeDineIn = orders.filter((o) => o.order_type === 'Dine-in' && o.status !== 'Completed' && o.status !== 'Cancelled').length;
      const takeawayOrders = orders.filter((o) => o.order_type === 'Takeaway').length;
      const deliveryOrders = orders.filter((o) => o.order_type === 'Delivery').length;
      const totalMenuItemsCount = menuItems.length;
      const lowStockCount = inventory.filter((i) => i.quantity <= i.reorder_level).length;
      const activeBranchesCount = branches.filter((b) => b.status === 'Active').length;

      const branchRevenueData = branches.map((b) => {
        const rev = activeOrders.filter((o) => o.branch_id === b.id).reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
        return { name: b.name.split('-')[1]?.trim() || b.name, revenue: rev };
      });
      const maxRevenue = Math.max(...branchRevenueData.map((d) => d.revenue), 1000);

      const dineCount = orders.filter((o) => o.order_type === 'Dine-in').length;
      const takeCount = orders.filter((o) => o.order_type === 'Takeaway').length;
      const delCount = orders.filter((o) => o.order_type === 'Delivery').length;
      const orderTypeData = [
        { label: 'Dine-In', count: dineCount, color: 'bg-orange-500' },
        { label: 'Takeaway', count: takeCount, color: 'bg-amber-500' },
        { label: 'Delivery', count: delCount, color: 'bg-teal-500' },
      ];
      const maxOrderType = Math.max(...orderTypeData.map((d) => d.count), 1);

      const hourlyBuckets = { '12 PM': 0, '2 PM': 0, '4 PM': 0, '6 PM': 0, '8 PM': 0, '10 PM': 0 };
      activeOrders.forEach((o) => {
        const h = new Date(o.created_at || Date.now()).getHours();
        const key = h < 13 ? '12 PM' : h < 15 ? '2 PM' : h < 17 ? '4 PM' : h < 19 ? '6 PM' : h < 21 ? '8 PM' : '10 PM';
        hourlyBuckets[key] += Number(o.total_amount || 0);
      });
      const hasLiveOrders = activeOrders.length > 0;
      const hourlySalesData = hasLiveOrders
        ? Object.entries(hourlyBuckets).map(([hour, sales]) => ({ hour, sales }))
        : [
            { hour: '12 PM', sales: 0 }, { hour: '2 PM', sales: 0 },
            { hour: '4 PM', sales: 0 }, { hour: '6 PM', sales: 0 },
            { hour: '8 PM', sales: 0 }, { hour: '10 PM', sales: 0 },
          ];
      const maxHourly = Math.max(...hourlySalesData.map((d) => d.sales), 1000);

      const catTotals = {};
      activeOrders.forEach((o) => {
        (o.items || []).forEach((it) => {
          const m = menuItems.find((x) => x.id === it.id);
          const cat = m?.category || 'General';
          catTotals[cat] = (catTotals[cat] || 0) + Number(it.price || 0) * Number(it.quantity || 1);
        });
      });
      const catSum = Object.values(catTotals).reduce((a, b) => a + b, 0) || 1;
      const catColors = ['bg-orange-500', 'bg-amber-500', 'bg-sky-500', 'bg-emerald-500'];
      const categorySalesData = Object.keys(catTotals).length > 0
        ? Object.entries(catTotals).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([cat, val], i) => ({
            cat, percent: Math.round((val / catSum) * 100), color: catColors[i % catColors.length],
          }))
        : [
            { cat: 'Karahi & BBQ', percent: 0, color: 'bg-orange-500' },
            { cat: 'Burgers & Wraps', percent: 0, color: 'bg-amber-500' },
            { cat: 'Starters & Sides', percent: 0, color: 'bg-sky-500' },
            { cat: 'Beverages & Desserts', percent: 0, color: 'bg-emerald-500' },
          ];

      const totalPay = activeOrders.length || 1;
      const cashPct = Math.round((activeOrders.filter((o) => o.payment_method === 'Cash').length / totalPay) * 100);
      const cardPct = Math.round((activeOrders.filter((o) => o.payment_method === 'Card').length / totalPay) * 100);
      const gcPct = Math.round((activeOrders.filter((o) => o.payment_method === 'Gift Card').length / totalPay) * 100);
      const paymentMethodData = [
        { type: 'Cash in Drawer', val: activeOrders.length ? cashPct : 0, color: 'bg-emerald-500' },
        { type: 'Card POS Swipe', val: activeOrders.length ? cardPct : 0, color: 'bg-indigo-500' },
        { type: 'Gift Cards & Vouchers', val: activeOrders.length ? gcPct : 0, color: 'bg-orange-500' },
      ];

      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const weekMap = { Mon: 0, Tue: 0, Wed: 0, Thu: 0, Fri: 0, Sat: 0, Sun: 0 };
      activeOrders.forEach((o) => {
        const d = dayNames[new Date(o.created_at || Date.now()).getDay()];
        if (d) weekMap[d] += Number(o.total_amount || 0);
      });
      const weeklyTrend = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((day) => ({ day, rev: weekMap[day] }));
      const maxWeekly = Math.max(...weeklyTrend.map((d) => d.rev), 1000);

      const newCount = orders.filter((o) => o.status === 'New Orders').length;
      const prepCount = orders.filter((o) => o.status === 'In Preparation').length;
      const readyDoneCount = orders.filter((o) => o.status === 'Ready for Pickup' || o.status === 'Completed').length;
      const totalKds = Math.max(newCount + prepCount + readyDoneCount, 1);
      const kdsSpeedData = [
        { stage: 'Ready / Completed', val: Math.round((readyDoneCount / totalKds) * 100), color: 'bg-emerald-500' },
        { stage: 'In Preparation', val: Math.round((prepCount / totalKds) * 100), color: 'bg-amber-500' },
        { stage: 'Queued (New Orders)', val: Math.round((newCount / totalKds) * 100), color: 'bg-rose-500' },
      ];

      const inventoryHealthData = inventory.length > 0
        ? inventory.slice(0, 4).map((it) => {
            const target = Math.max(Number(it.reorder_level || 5) * 3, 10);
            const pct = Math.min(100, Math.round((Number(it.quantity || 0) / target) * 100));
            return {
              name: it.name,
              level: pct,
              color: pct <= 35 ? 'bg-rose-500' : pct <= 65 ? 'bg-amber-500' : 'bg-emerald-500',
            };

      return (
        <div className="space-y-6">
          {/* Header Banner */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-xl font-extrabold text-slate-900">Royal India By Spicy Twist Executive Dashboard</h2>
              <p className="text-xs text-slate-500 mt-1">
                Real-time multi-branch financial metrics in <span className="text-orange-600 font-bold">Pakistani Rupees (Rs.)</span>
              </p>
            </div>
            <div className="mt-4 sm:mt-0 flex flex-wrap items-center gap-2">
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> {cloudConnected ? 'Cloud Sync PKR Live' : 'Royal India By Spicy Twist PKR Live'}
              </span>
              <button type="button" onClick={onExportBackup} className="inline-flex items-center gap-2 rounded-xl bg-orange-500 px-4 py-2 text-xs font-bold text-white shadow-md shadow-orange-500/20 transition hover:bg-orange-600">
                <Icon name="download" className="w-4 h-4" /> Export Backup

          </div>

          {/* 8 KPI SUMMARY CARDS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

            <KpiCard title="Total Orders Count" value={totalOrders} subtext="All status orders processed" icon={<Icon name="clipboard-list" className="w-5 h-5 text-sky-600" />} />
            <KpiCard title="Active Dine-in Tables" value={activeDineIn} subtext="Tables currently occupied" icon={<Icon name="utensils" className="w-5 h-5 text-amber-600" />} />
            <KpiCard title="Takeaway Orders" value={takeawayOrders} subtext="Pickup orders count" icon={<Icon name="shopping-bag" className="w-5 h-5 text-indigo-600" />} />
            <KpiCard title="Delivery Orders" value={deliveryOrders} subtext="Home delivery dispatch" icon={<Icon name="bike" className="w-5 h-5 text-teal-600" />} />
            <KpiCard title="Total Menu Items" value={totalMenuItemsCount} subtext="Active food & drink dishes" icon={<Icon name="book-open" className="w-5 h-5 text-purple-600" />} />
            <KpiCard title="Low Stock Alerts" value={lowStockCount} subtext="Ingredients below reorder level" icon={<Icon name="alert-triangle" className="w-5 h-5 text-rose-600" />} />
            <KpiCard title="Active Branches" value={activeBranchesCount} subtext="Royal India By Spicy Twist locations" icon={<Icon name="building-2" className="w-5 h-5 text-orange-500" />} />
          </div>

          {/* 8 ANALYTICAL VISUALIZER CHARTS */}
          <div className="space-y-4 pt-2">
            <h3 className="text-base font-extrabold text-slate-900 flex items-center gap-2">
              <Icon name="pie-chart" className="w-5 h-5 text-orange-600" /> Executive Analytics & 8 Visual Charts
            </h3>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              {/* CHART 1: BRANCH SALES REVENUE */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="bar-chart-3" className="w-4 h-4 text-orange-600" /> 1. Branch Revenue (PKR)
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Comparison across branches</p>
                  <div className="h-36 flex items-end justify-around gap-2 pt-4 border-b border-slate-100">
                    {branchRevenueData.map((b, idx) => (
                      <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end">
                        <div className="w-full bg-gradient-to-t from-orange-600 to-amber-500 rounded-t-lg" style={{ height: `${Math.max((b.revenue / maxRevenue) * 100, 10)}%` }}></div>
                        <span className="text-[10px] text-slate-600 font-bold mt-2 truncate w-full text-center">{b.name.split(' ')[0]}</span>
                      </div>

              {/* CHART 2: ORDER TYPES BREAKDOWN */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="pie-chart" className="w-4 h-4 text-amber-600" /> 2. Order Channel Types
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Dine-in vs Takeaway vs Delivery</p>
                  <div className="space-y-3 pt-2">
                    {orderTypeData.map((ot, idx) => (
                      <div key={idx} className="space-y-1">
                        <div className="flex justify-between text-[11px] font-bold">
                          <span className="text-slate-700">{ot.label}</span>

                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">

              {/* CHART 3: PEAK SALES HOURLY TIMELINE */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="clock" className="w-4 h-4 text-sky-600" /> 3. Peak Hourly Traffic
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Sales curve across lunch/dinner</p>
                  <div className="h-36 flex items-end justify-between gap-1 pt-4 border-b border-slate-100">
                    {hourlySalesData.map((hs, idx) => (
                      <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end">
                        <div className="w-full bg-sky-500 rounded-t" style={{ height: `${Math.max((hs.sales / maxHourly) * 100, 6)}%` }}></div>
                        <span className="text-[9px] text-slate-500 mt-2">{hs.hour}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* CHART 4: CATEGORY SHARE */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="layers" className="w-4 h-4 text-emerald-600" /> 4. Menu Category Share
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Popularity % by food group</p>
                  <div className="space-y-2.5">
                    {categorySalesData.map((cat, idx) => (
                      <div key={idx} className="space-y-0.5">
                        <div className="flex justify-between text-[10px] font-semibold text-slate-700">
                          <span>{cat.cat}</span>
                          <span className="font-bold text-slate-900">{cat.percent}%</span>

                        <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                          <div className={`${cat.color} h-full`} style={{ width: `${cat.percent}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* CHART 5: PAYMENT METHODS */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="wallet" className="w-4 h-4 text-indigo-600" /> 5. Payment Methods
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Cash vs Card vs Gift Cards</p>
                  <div className="space-y-3">
                    {paymentMethodData.map((pm, idx) => (
                      <div key={idx} className="space-y-1">
                        <div className="flex justify-between text-[11px] font-bold">
                          <span className="text-slate-700">{pm.type}</span>
                          <span className="text-indigo-600">{pm.val}%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className={`${pm.color} h-2 rounded-full`} style={{ width: `${pm.val}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* CHART 6: WEEKLY TRENDLINE */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="trending-up" className="w-4 h-4 text-emerald-600" /> 6. Weekly Revenue Trend
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Day-by-day weekly growth</p>
                  <div className="h-36 flex items-end justify-between gap-1 pt-4 border-b border-slate-100">
                    {weeklyTrend.map((wt, idx) => (
                      <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end">
                        <div className="w-full bg-emerald-500 rounded-t-lg" style={{ height: `${Math.max((wt.rev / maxWeekly) * 100, 6)}%` }}></div>
                        <span className="text-[9px] text-slate-500 mt-2 font-bold">{wt.day}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* CHART 7: KITCHEN PREP SPEED */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="timer" className="w-4 h-4 text-rose-600" /> 7. Kitchen Order Pipeline
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Order fulfillment status</p>
                  <div className="space-y-3">
                    {kdsSpeedData.map((ks, idx) => (
                      <div key={idx} className="space-y-1">
                        <div className="flex justify-between text-[10px] font-bold">
                          <span className="text-slate-700">{ks.stage}</span>
                          <span>{ks.val}%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className={`${ks.color} h-2 rounded-full`} style={{ width: `${ks.val}%` }}></div>
                        </div>
                      </div>
                    ))}
