                </div>
              </div>

              {/* CHART 8: INVENTORY HEALTH */}
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <h4 className="font-bold text-xs text-slate-900 flex items-center gap-1.5 mb-1">
                    <Icon name="boxes" className="w-4 h-4 text-purple-600" /> 8. Stock Health Status
                  </h4>
                  <p className="text-[10px] text-slate-400 mb-4">Key ingredient storage levels</p>
                  <div className="space-y-3">
                    {inventoryHealthData.map((ih, idx) => (
                      <div key={idx} className="space-y-1">
                        <div className="flex justify-between text-[10px] font-bold">
                          <span className="text-slate-700 truncate max-w-[140px]">{ih.name}</span>
                          <span>{ih.level}%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className={`${ih.color} h-2 rounded-full`} style={{ width: `${ih.level}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 2: POINT OF SALE (POS) & BILLING (PKR & GIFT CARDS)
    // ==========================================
    function POSModule({
      menuItems, allMenuItems, setMenuItems, selectedBranchId, branches,
      orders, setOrders, registerState, setRegisterState, registerExistsInCloud,
      showToast, setReceiptModalOrder, promos, setPromos, giftCards, setGiftCards,
      currentUser, cloudConnected, allowedEmails, C,
    }) {
      const [cart, setCart] = useState([]);
      const [openItemMenuId, setOpenItemMenuId] = useState(null);
      const [confirmDeleteItem, setConfirmDeleteItem] = useState(null);
      const [productModalOpen, setProductModalOpen] = useState(false);
      const [editingProductId, setEditingProductId] = useState(null);
      const [productForm, setProductForm] = useState({ name: '', category: 'BBQ', price: '', stock: '50', image: '' });
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [orderType, setOrderType] = useState('Dine-in');
      const [tableNumber, setTableNumber] = useState('T-01');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [customNotes, setCustomNotes] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('Cash');
      const [selectedGiftCardId, setSelectedGiftCardId] = useState('');
      const [discountPercent, setDiscountPercent] = useState(0);
      const [fixedDiscount, setFixedDiscount] = useState(0);
      const [appliedPromoId, setAppliedPromoId] = useState('');
      const [discountCode, setDiscountCode] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [activeBranchForOrder, setActiveBranchForOrder] = useState(
        selectedBranchId !== 'all' ? selectedBranchId : branches[0]?.id || 'b1'
      );

      useEffect(() => {
        if (selectedBranchId !== 'all') setActiveBranchForOrder(selectedBranchId);
        else if (!branches.some((branch) => branch.id === activeBranchForOrder)) setActiveBranchForOrder(branches[0]?.id || 'b1');
      }, [selectedBranchId, branches, activeBranchForOrder]);

      const categories = ['All', 'BBQ', 'Karahi', 'Handi', 'Qorma', 'Rice', 'Tandoor & Breads', 'Burgers', 'Pizzas', 'Starters', 'Chinese', 'Pasta', 'Seafood', 'Deals', 'Drinks', 'Desserts'];

      const openAddProduct = () => {
        setEditingProductId(null);
        setProductForm({ name: '', category: 'BBQ', price: '', stock: '50', image: '' });
        setProductModalOpen(true);
      };

      const openEditProduct = (item) => {
        setEditingProductId(item.id);
        setProductForm({ name: item.name, category: item.category, price: String(item.price), stock: String(item.stock ?? 50), image: item.image || '' });
        setOpenItemMenuId(null);
        setProductModalOpen(true);
      };

      const saveProduct = async (event) => {
        event.preventDefault();
        const name = C.clampStr(productForm.name, C.LIMITS.nameMax);
        const priceText = String(productForm.price || '').trim();
        const stockText = String(productForm.stock ?? '').trim();
        const price = Number(priceText);
        const stock = Number(stockText);
        const image = C.clampStr(productForm.image, C.LIMITS.imageMax);

        if (!name) { showToast('Please enter a product name.', 'error'); return; }
        if (!priceText || !Number.isFinite(price) || price <= 0) { showToast('Please enter a price greater than zero.', 'error'); return; }
        if (!stockText || !Number.isInteger(stock) || stock < 0) { showToast('Please enter a whole-number stock quantity of zero or more.', 'error'); return; }

        try {
          if (editingProductId) {
            if (cloudConnected) {
              await C.updateCloudDoc('menuItems', editingProductId, { name, category: productForm.category, price, stock, image });
            } else {
              setMenuItems((prev) => prev.map((it) => it.id === editingProductId ? { ...it, name, category: productForm.category, price, stock, image } : it));
            }
            showToast('Product updated in menu & synced!', 'success');
          } else {
            const id = `menu-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
            const availability = selectedBranchId === 'all' ? branches.map((b) => b.id) : [selectedBranchId];
            const newItem = { id, name, category: productForm.category, price, stock, image, availability };
            if (cloudConnected) {
              await C.createCloudDoc('menuItems', id, newItem, allowedEmails);
            } else {
              setMenuItems((prev) => [...prev, newItem]);
            }
            showToast('Product added to menu & synced!', 'success');
          }
          setProductModalOpen(false);
        } catch (err) {
          showToast('Could not save menu item to cloud.', 'error');
        }
      };

      const confirmDeleteProduct = async () => {
        if (!confirmDeleteItem) return;
        const item = confirmDeleteItem;
        try {
          if (cloudConnected) {
            await C.deleteCloudDoc('menuItems', item.id);
          } else {
            setMenuItems((prev) => prev.filter((entry) => entry.id !== item.id));
          }
          setCart((prev) => prev.filter((entry) => entry.id !== item.id));
          setOpenItemMenuId(null);
          setConfirmDeleteItem(null);
          showToast('Product removed from menu.', 'success');
        } catch (err) {
          showToast('Failed to remove product.', 'error');
        }
      };

      const filteredItems = menuItems.filter((item) => {
        const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const addToCart = (item) => {
        setCart((prev) => {
          const existing = prev.find((entry) => entry.id === item.id);
          const stock = Number(item.stock ?? 50);
          if (existing && existing.quantity >= stock) {
            showToast(`Only ${stock} ${item.name} available.`, 'warning');
            return prev;
          }
          if (!existing && stock < 1) {
            showToast(`${item.name} is out of stock.`, 'warning');
            return prev;
          }
          if (existing) {
            return prev.map((entry) => (entry.id === item.id ? { ...entry, quantity: entry.quantity + 1 } : entry));
          }
          return [...prev, { ...item, quantity: 1, notes: '' }];
        });
      };

      const updateQuantity = (id, delta) => {
        setCart((prev) =>
          prev
            .map((item) => {
              if (item.id === id) {
                const stock = Number(item.stock ?? 50);
                const newQty = item.quantity + delta;
                if (newQty > stock) {
                  showToast(`Only ${stock} ${item.name} available.`, 'warning');
                  return item;
                }
                return newQty > 0 ? { ...item, quantity: newQty } : null;
              }
              return item;
            })
            .filter(Boolean)
        );
      };

      const updateItemNotes = (id, notes) => {
        setCart((prev) => prev.map((i) => (i.id === id ? { ...i, notes } : i)));
      };

      const subtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
      const discountAmount = Math.min(subtotal, (subtotal * discountPercent) / 100 + fixedDiscount);
      const tax = (subtotal - discountAmount) * 0.16;
      const grandTotal = subtotal - discountAmount + tax;

      const applyDiscount = () => {
        const foundPromo = promos.find((p) => p.code === discountCode.trim().toUpperCase() && p.status === 'Active');
        if (foundPromo) {
          setDiscountPercent(foundPromo.discountType === 'percentage' ? Math.min(100, Number(foundPromo.value) || 0) : 0);
          setFixedDiscount(foundPromo.discountType === 'flat' ? Math.max(0, Number(foundPromo.value) || 0) : 0);
          setAppliedPromoId(foundPromo.id);
          showToast(foundPromo.discountType === 'flat' ? `Rs. ${foundPromo.value} discount applied!` : `${foundPromo.value}% promo discount applied!`, 'success');
        } else {
          setDiscountPercent(0);
          setFixedDiscount(0);
          setAppliedPromoId('');
          showToast('Invalid Promo Code', 'error');
        }
      };

      const handleCheckout = async () => {
        if (cart.length === 0) { showToast('Cart is empty!', 'warning'); return; }
        if (submitting) return;

        let selectedGiftCard = null;
        if (paymentMethod === 'Gift Card') {
          selectedGiftCard = giftCards.find((card) => card.id === selectedGiftCardId && card.status === 'Active');
          if (!selectedGiftCard) { showToast('Select an active gift card before checkout.', 'warning'); return; }
          if (Number(selectedGiftCard.balance) < grandTotal) { showToast('Gift card balance is not enough to cover this order.', 'error'); return; }
        }

        const unavailableItem = cart.find((cartItem) => {
          const currentItem = allMenuItems.find((item) => item.id === cartItem.id);
          return !currentItem || cartItem.quantity > Number(currentItem.stock ?? 50);
        });
        if (unavailableItem) {
          showToast(`${unavailableItem.name} is no longer available in that quantity.`, 'error');
          return;
        }

        const orderId = `ord-${Date.now()}`;
        const cleanItems = cart.slice(0, C.LIMITS.maxOrderItems).map((it) => ({
          id: C.sanitizeId(it.id, 'item'),
          name: C.clampStr(it.name, C.LIMITS.nameMax),
          price: C.clampNum(it.price, 0, 10000000),
          quantity: Math.max(1, Math.round(C.clampNum(it.quantity, 1, 1000))),
          notes: C.clampStr(it.notes || '', C.LIMITS.notesMax),
        }));

        const newOrder = {
          id: orderId,
          order_number: `#${Math.floor(1000 + Math.random() * 9000)}`,
          branch_id: C.sanitizeId(activeBranchForOrder, 'b1'),
          table_number: C.clampStr(tableNumber || 'T-01', C.LIMITS.tableMax),
          customer_name: C.clampStr(customerName, C.LIMITS.shortNameMax),
          customer_phone: C.clampStr(customerPhone, C.LIMITS.phoneMax),
          order_type: orderType,
          status: 'New Orders',
          items: cleanItems,
          subtotal: Number(subtotal.toFixed(0)),
          discount_amount: Number(discountAmount.toFixed(0)),
          tax_amount: Number(tax.toFixed(0)),
          total_amount: Number(grandTotal.toFixed(0)),
          payment_method: paymentMethod,
          custom_notes: C.clampStr(customNotes, C.LIMITS.notesMax),
          created_by: C.clampStr(currentUser?.name || 'Waiter/Cashier', C.LIMITS.shortNameMax),
          created_at: new Date().toISOString(),
        };

        setSubmitting(true);
        try {
          if (cloudConnected) {
            await C.createCloudDoc('orders', orderId, newOrder, allowedEmails);
            await Promise.all(
              cart.map((orderedItem) => {
                const current = allMenuItems.find((m) => m.id === orderedItem.id);
                if (!current) return Promise.resolve();
                const nextStock = Math.max(0, Number(current.stock ?? 50) - orderedItem.quantity);
                return C.updateCloudDoc('menuItems', current.id, { stock: nextStock });
              })
            );
            if (paymentMethod === 'Cash') {
              await C.upsertCashRegister(
                'main',
                {
                  isOpen: registerState.isOpen,
                  openingBalance: registerState.openingBalance,
                  currentCash: Number(registerState.currentCash || 0) + newOrder.total_amount,
                  cashDrops: registerState.cashDrops || [],
                },
                allowedEmails,
                registerExistsInCloud
              );
            } else if (paymentMethod === 'Gift Card' && selectedGiftCard) {
              const nextBal = Math.max(0, Number(selectedGiftCard.balance) - newOrder.total_amount);
              await C.updateCloudDoc('giftCards', selectedGiftCard.id, {
                balance: nextBal,
                status: nextBal === 0 ? 'Redeemed' : 'Active',
              });
            }
            if (appliedPromoId) {
              const promoDoc = promos.find((p) => p.id === appliedPromoId);
              if (promoDoc) {
                await C.updateCloudDoc('promos', promoDoc.id, { usageCount: Number(promoDoc.usageCount || 0) + 1 });
              }
            }
          } else {
            setOrders((prev) => [newOrder, ...prev]);
            setMenuItems((prev) => prev.map((item) => {
              const orderedItem = cart.find((entry) => entry.id === item.id);
              return orderedItem ? { ...item, stock: Math.max(0, Number(item.stock ?? 50) - orderedItem.quantity) } : item;
            }));
            if (paymentMethod === 'Cash') {
              setRegisterState((prev) => ({ ...prev, currentCash: prev.currentCash + newOrder.total_amount }));
            } else if (paymentMethod === 'Gift Card' && selectedGiftCard) {
              setGiftCards((prev) => prev.map((card) => card.id === selectedGiftCardId ? { ...card, balance: Math.max(0, Number(card.balance) - newOrder.total_amount) } : card));
            }
          }

          setCart([]);
          setCustomerName('');
          setCustomerPhone('');
          setCustomNotes('');
          setDiscountPercent(0);
          setFixedDiscount(0);
          setDiscountCode('');
          setAppliedPromoId('');
          showToast(`Order ${newOrder.order_number} sent directly to Kitchen & printed!`, 'success');
          setReceiptModalOrder(newOrder);
        } catch (err) {
          showToast('Order submission failed. Check cloud permissions or branch setup.', 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="h-full flex flex-col lg:flex-row gap-6">
          <div className="flex-1 flex flex-col gap-4">
            {selectedBranchId === 'all' && (
              <div className="bg-orange-50 border border-orange-200 p-3 rounded-xl flex items-center justify-between text-xs text-orange-900 font-semibold">
                <span>Aggregated View: Select branch for this order:</span>
                <select
                  value={activeBranchForOrder}
                  onChange={(e) => setActiveBranchForOrder(e.target.value)}
                  className="bg-white border border-orange-300 text-slate-900 rounded px-2 py-1 text-xs font-bold"
                >
                  {branches.map((b) => (
                    <option key={b.id} value={b.id}>{b.name}</option>
                  ))}
                </select>
              </div>
            )}

            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
              <div className="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                {categories.map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                      selectedCategory === cat
                        ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <div className="relative flex-1 sm:w-56">
                  <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" />
                  <input
                    type="text"
                    placeholder="Search items..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-orange-500"
                  />
                </div>
                <button
                  type="button"
                  onClick={openAddProduct}
                  className="px-3 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold whitespace-nowrap flex items-center gap-1 shadow-sm"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" /> Add Item
                </button>
              </div>
            </div>

            {filteredItems.length === 0 ? (
              <div className="bg-white border border-slate-200 rounded-2xl p-12 text-center my-auto shadow-sm">
                <Icon name="book-open" className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                <h3 className="font-bold text-slate-800 text-base">No Menu Items Available</h3>
                <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
                  Royal India By Spicy Twist has no items in the menu currently. Go to "Menu Management" or click "Add Item" above to add your custom dishes!
                </p>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto max-h-[calc(100vh-220px)] pr-1">
                {filteredItems.map((item) => (
                  <div
                    key={item.id}
                    onClick={() => addToCart(item)}
                    className="group bg-white border border-slate-200 rounded-2xl overflow-hidden hover:border-orange-500 transition cursor-pointer flex flex-col justify-between shadow-sm hover:shadow-md"
                  >
                    <div className="h-32 relative overflow-hidden bg-slate-100">
                      <img
                        src={item.image || C.DEFAULT_DISH_IMAGE_URL}
                        onError={C.fallbackImgSrc}
                        alt={item.name}
                        className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                      />
                      <span className="absolute top-2 right-2 bg-white/90 backdrop-blur-md px-2 py-0.5 rounded-lg text-[10px] font-bold text-orange-600 border border-slate-200 shadow-sm">
                        Rs. {item.price}
                      </span>
                      <div className="absolute top-2 left-2" onClick={(event) => event.stopPropagation()}>
                        <button
                          type="button"
                          aria-label={`More options for ${item.name}`}
                          onClick={() => setOpenItemMenuId(openItemMenuId === item.id ? null : item.id)}
                          className="flex h-7 w-7 items-center justify-center rounded-lg bg-white/95 text-slate-700 shadow hover:bg-white"
                        >
                          <Icon name="more-vertical" className="w-4 h-4" />
                        </button>
                        {openItemMenuId === item.id && (
                          <div className="absolute left-0 top-8 z-20 w-28 rounded-xl border border-slate-200 bg-white p-1 shadow-xl">
                            <button type="button" onClick={() => openEditProduct(item)} className="w-full rounded-lg px-3 py-2 text-left text-xs font-semibold text-slate-700 hover:bg-slate-100">Edit</button>
                            <button type="button" onClick={() => { setConfirmDeleteItem(item); setOpenItemMenuId(null); }} className="w-full rounded-lg px-3 py-2 text-left text-xs font-semibold text-rose-600 hover:bg-rose-50">Delete</button>
                          </div>
                        )}
                      </div>
                    </div>
                    <div className="p-3">
                      <h4 className="font-bold text-xs text-slate-800 line-clamp-1 group-hover:text-orange-600 transition">
                        {item.name}
                      </h4>
                      <div className="flex items-center justify-between mt-2 text-[11px] text-slate-500">
                        <span>Stock: {item.stock ?? 50}</span>
                        <button
                          type="button"
                          onClick={(event) => {
                            event.stopPropagation();
                            addToCart(item);
                          }}
                          className="inline-flex items-center gap-1 rounded-lg bg-orange-100 px-2 py-1.5 text-[10px] font-bold text-orange-600 transition hover:bg-orange-500 hover:text-white"
                        >
                          <Icon name="plus" className="w-3.5 h-3.5" /> Add item
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Right Cart Panel */}
          <div className="w-full lg:w-96 bg-white border border-slate-200 rounded-2xl flex flex-col justify-between p-4 shadow-sm">
            <div>
              <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
                  <Icon name="shopping-bag" className="w-4 h-4 text-orange-600" /> Current Order Cart
                </h3>
                <span className="text-xs text-slate-500 font-bold">{cart.length} items</span>
              </div>

              <div className="grid grid-cols-2 gap-2 my-3">
                <div>
                  <label className="text-[10px] uppercase font-bold text-slate-400">Order Type</label>
                  <select
                    value={orderType}
                    onChange={(e) => setOrderType(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 text-xs text-slate-800 rounded-xl p-2 mt-1 focus:outline-none font-semibold"
                  >
                    <option value="Dine-in">Dine-in</option>
                    <option value="Takeaway">Takeaway</option>
                    <option value="Delivery">Delivery</option>
                  </select>
                </div>
                <div>
                  <label className="text-[10px] uppercase font-bold text-slate-400">Table / Ref</label>
                  <input
                    type="text"
                    value={tableNumber}
                    onChange={(e) => setTableNumber(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 text-xs text-slate-800 rounded-xl p-2 mt-1 focus:outline-none font-semibold"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 mb-2">
                <input
                  type="text"
                  placeholder="Customer name"
                  value={customerName}
                  onChange={(e) => setCustomerName(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 text-xs text-slate-800 rounded-xl p-2 focus:outline-none font-semibold"
                />
                <input
                  type="tel"
                  placeholder="Customer phone"
                  value={customerPhone}
                  onChange={(e) => setCustomerPhone(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 text-xs text-slate-800 rounded-xl p-2 focus:outline-none font-semibold"
                />
              </div>

              <input
                type="text"
                placeholder="Kitchen / Order notes (optional)..."
                value={customNotes}
                onChange={(e) => setCustomNotes(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 text-xs text-slate-800 rounded-xl p-2 mb-3 focus:outline-none"
              />

              <div className="space-y-3 max-h-48 overflow-y-auto pr-1 border-b border-slate-100 pb-3">
                {cart.length === 0 ? (
                  <div className="text-center py-8 text-slate-400 text-xs">
                    No items added to order yet.
                  </div>
                ) : (
                  cart.map((item) => (
                    <div key={item.id} className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-bold text-slate-800">{item.name}</span>
                        <span className="text-orange-600 font-bold">Rs. {(item.price * item.quantity).toLocaleString()}</span>
                      </div>
                      <input
                        type="text"
                        placeholder="Custom notes (e.g. Extra spicy)..."
                        value={item.notes}
                        onChange={(e) => updateItemNotes(item.id, e.target.value)}
                        className="w-full bg-transparent text-[11px] text-slate-600 placeholder-slate-400 mt-1 focus:outline-none"
                      />
                      <div className="flex items-center justify-between mt-2 pt-1 border-t border-slate-200">
                        <span className="text-[10px] text-slate-500 font-medium">Rs. {item.price} each</span>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => updateQuantity(item.id, -1)}
                            className="w-6 h-6 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center font-bold text-xs"
                          >
                            -
                          </button>
                          <span className="text-xs font-bold text-slate-900 w-4 text-center">{item.quantity}</span>
                          <button
                            onClick={() => updateQuantity(item.id, 1)}
                            className="w-6 h-6 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center font-bold text-xs"
                          >
                            +
                          </button>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

            <div className="space-y-3 pt-3">
              <div className="flex gap-2">
                <input
                  type="text"
                  placeholder="Promo Code (PROMO10)"
                  value={discountCode}
                  onChange={(e) => setDiscountCode(e.target.value)}
                  className="flex-1 bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-1.5 text-slate-800 uppercase font-semibold"
                />
                <button
                  onClick={applyDiscount}
                  className="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-xs font-bold rounded-xl text-slate-800"
                >
                  Apply
                </button>
              </div>

              <div className="space-y-1.5 text-xs text-slate-500 font-medium">
                <div className="flex justify-between">
                  <span>Subtotal:</span>
                  <span>Rs. {subtotal.toLocaleString()}</span>
                </div>
                {discountAmount > 0 && (
                  <div className="flex justify-between text-orange-600 font-bold">
                    <span>Discount{discountPercent > 0 ? ` (${discountPercent}%)` : ''}:</span>
                    <span>-Rs. {discountAmount.toLocaleString()}</span>
                  </div>
                )}
                <div className="flex justify-between">
                  <span>Sales Tax (16% GST):</span>
                  <span>Rs. {tax.toLocaleString(undefined, { maximumFractionDigits: 0 })}</span>
                </div>
                <div className="flex justify-between font-extrabold text-sm text-slate-900 border-t border-slate-200 pt-2 mt-1">
                  <span>Grand Total:</span>
                  <span className="text-orange-600">Rs. {grandTotal.toLocaleString(undefined, { maximumFractionDigits: 0 })}</span>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 pt-1">
                {['Cash', 'Card', 'Gift Card'].map((pm) => (
                  <button
                    key={pm}
                    onClick={() => setPaymentMethod(pm)}
                    className={`py-1.5 rounded-xl text-[11px] font-bold border transition ${
                      paymentMethod === pm
                        ? 'bg-orange-500 border-orange-500 text-white shadow-sm'
                        : 'bg-slate-50 border-slate-200 text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {pm}
                  </button>
                ))}
              </div>
              {paymentMethod === 'Gift Card' && (
                <select
                  value={selectedGiftCardId}
                  onChange={(event) => setSelectedGiftCardId(event.target.value)}
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 p-2 text-xs font-semibold text-slate-800"
                >
                  <option value="">Select an active gift card</option>
                  {giftCards.filter((card) => card.status === 'Active').map((card) => (
                    <option key={card.id} value={card.id}>{card.code} — Rs. {Number(card.balance).toLocaleString()}</option>
                  ))}
                </select>
              )}

              <button
                onClick={handleCheckout}
                disabled={submitting}
                className="w-full bg-orange-500 hover:bg-orange-600 disabled:opacity-60 text-white font-bold py-3 rounded-xl shadow-lg shadow-orange-500/30 transition flex items-center justify-center gap-2"
              >
                <Icon name="receipt" className="w-4 h-4" /> {submitting ? 'Sending to Kitchen...' : 'Place Order & Print Bill'}
              </button>
            </div>
          </div>

          {productModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
              <form noValidate onSubmit={saveProduct} className="w-full max-w-md space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-900">{editingProductId ? 'Edit Product' : 'Add Product to Menu'}</h3>
                  <button type="button" onClick={() => setProductModalOpen(false)} aria-label="Close" className="text-slate-400 hover:text-slate-800">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <input required value={productForm.name} onChange={(event) => setProductForm({ ...productForm, name: event.target.value })} placeholder="Product name" className="w-full rounded-xl border border-slate-200 p-2.5 text-sm" />
                <div className="grid grid-cols-2 gap-3">
                  <select value={productForm.category} onChange={(event) => setProductForm({ ...productForm, category: event.target.value })} className="rounded-xl border border-slate-200 p-2.5 text-sm">
                    {categories.filter((category) => category !== 'All').map((category) => <option key={category} value={category}>{category}</option>)}
                  </select>
                  <input required type="number" min="0.01" step="0.01" value={productForm.price} onChange={(event) => setProductForm({ ...productForm, price: event.target.value })} placeholder="Price (Rs.)" className="rounded-xl border border-slate-200 p-2.5 text-sm" />
                </div>
                <input required type="number" min="0" step="1" value={productForm.stock} onChange={(event) => setProductForm({ ...productForm, stock: event.target.value })} placeholder="Stock quantity" className="w-full rounded-xl border border-slate-200 p-2.5 text-sm" />
                <input type="url" value={productForm.image} onChange={(event) => setProductForm({ ...productForm, image: event.target.value })} placeholder="Image URL (optional)" className="w-full rounded-xl border border-slate-200 p-2.5 text-sm" />
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setProductModalOpen(false)} className="rounded-xl bg-slate-100 px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-slate-200">Cancel</button>
                  <button type="submit" className="rounded-xl bg-orange-500 px-4 py-2.5 text-xs font-bold text-white hover:bg-orange-600">{editingProductId ? 'Save Changes' : 'Save Product'}</button>
                </div>
              </form>
            </div>
          )}

          {confirmDeleteItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
              <div className="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl space-y-4">
                <h3 className="font-bold text-base text-slate-900">Remove Menu Item</h3>
                <p className="text-xs text-slate-600">Are you sure you want to remove <strong>{confirmDeleteItem.name}</strong> from the menu?</p>
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setConfirmDeleteItem(null)} className="rounded-xl bg-slate-100 px-4 py-2 text-xs font-bold text-slate-700 hover:bg-slate-200">Cancel</button>
                  <button type="button" onClick={confirmDeleteProduct} className="rounded-xl bg-rose-600 px-4 py-2 text-xs font-bold text-white hover:bg-rose-700">Remove</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE 4: ORDER MANAGEMENT & VOID LOGGING
    // ==========================================
    function OrderManagementModule({
      orders, setOrders, branches, menuItems, setReceiptModalOrder,
      showToast, selectedBranchId, voidLogs, setVoidLogs, currentUser,
      cloudConnected, allowedEmails, C,
    }) {
      const [statusFilter, setStatusFilter] = useState('All');
      const [addModalOpen, setAddModalOpen] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);
      const [voidTarget, setVoidTarget] = useState(null);
      const [voidReason, setVoidReason] = useState('');

      const [orderForm, setOrderForm] = useState({
        branch_id: selectedBranchId !== 'all' ? selectedBranchId : branches[0]?.id || 'b1',
        table_number: 'T-01',
        customer_name: '',
        customer_phone: '',
        order_type: 'Dine-in',
        payment_method: 'Cash',
        status: 'New Orders',
        items: [],
        custom_notes: '',
      });

      const filtered = orders.filter((o) => (statusFilter === 'All' ? true : o.status === statusFilter));

      const handleOpenAddModal = () => {
        setEditingOrder(null);
        setOrderForm({
          branch_id: selectedBranchId !== 'all' ? selectedBranchId : branches[0]?.id || 'b1',
          table_number: 'T-05',
          customer_name: '',
          customer_phone: '',
          order_type: 'Dine-in',
          payment_method: 'Cash',
          status: 'New Orders',
          items: [{ item_id: menuItems[0]?.id || '', quantity: 1, notes: '' }],
          custom_notes: '',
        });
        setAddModalOpen(true);
      };

      const handleOpenEditModal = (ord) => {
        setEditingOrder(ord);
        setOrderForm({
          branch_id: ord.branch_id,
          table_number: ord.table_number,
          customer_name: ord.customer_name || '',
          customer_phone: ord.customer_phone || '',
          order_type: ord.order_type,
          payment_method: ord.payment_method,
          status: ord.status,
          items: (ord.items || []).map((i) => ({
            item_id: i.id || menuItems.find((m) => m.name === i.name)?.id || '',
            quantity: i.quantity,
            notes: i.notes || '',
          })),
          custom_notes: ord.custom_notes || '',
        });
        setAddModalOpen(true);
      };

      const confirmVoidOrder = async (e) => {
        e.preventDefault();
        if (!voidTarget || !voidReason.trim()) {
          showToast('Please enter a reason to void this order.', 'error');
          return;
        }
        const voidId = `v-${Date.now()}`;
        const newVoid = {
          id: voidId,
          orderNumber: C.clampStr(voidTarget.order_number, C.LIMITS.orderNumberMax),
          item: 'Whole Order Voided',
          amount: C.clampNum(voidTarget.total_amount, 0),
          reason: C.clampStr(voidReason, C.LIMITS.notesMax),
          voidedBy: C.clampStr(currentUser?.name || 'Admin', C.LIMITS.shortNameMax),
          date: new Date().toLocaleString(),
        };
        try {
          if (cloudConnected) {
            await C.createCloudDoc('voidLogs', voidId, newVoid, allowedEmails, { hasUpdatedAt: false });
            await C.deleteCloudDoc('orders', voidTarget.id);
          } else {
            setVoidLogs([newVoid, ...voidLogs]);
            setOrders((prev) => prev.filter((o) => o.id !== voidTarget.id));
          }
          showToast(`Order ${voidTarget.order_number} voided and logged to audit table!`, 'warning');
          setVoidTarget(null);
          setVoidReason('');
        } catch (err) {
          showToast('Failed to void order in cloud.', 'error');
        }
      };

      const handleAddItemToForm = () => {
        setOrderForm((prev) => ({
          ...prev,
          items: [...prev.items, { item_id: menuItems[0]?.id || '', quantity: 1, notes: '' }],
        }));
      };

      const handleRemoveItemFromForm = (index) => {
        setOrderForm((prev) => ({
          ...prev,
          items: prev.items.filter((_, idx) => idx !== index),
        }));
      };

      const handleSaveOrder = async (e) => {
        e.preventDefault();
        if (orderForm.items.length === 0) { showToast('Please add at least one item to the order', 'error'); return; }
        const hasInvalidItem = orderForm.items.some((row) =>
          !menuItems.some((item) => item.id === row.item_id) ||
          !Number.isInteger(Number(row.quantity)) || Number(row.quantity) < 1
        );
        if (hasInvalidItem) {
          showToast('Select a menu item and enter a whole-number quantity of at least 1.', 'error');
          return;
        }

        const compiledItems = orderForm.items.slice(0, C.LIMITS.maxOrderItems).map((row) => {
          const foundItem = menuItems.find((m) => m.id === row.item_id) || menuItems[0];
          return {
            id: C.sanitizeId(foundItem ? foundItem.id : 'custom', 'item'),
            name: C.clampStr(foundItem ? foundItem.name : 'Item', C.LIMITS.nameMax),
            price: C.clampNum(foundItem ? foundItem.price : 100, 0, 10000000),
            quantity: Math.max(1, Math.round(Number(row.quantity))),
            notes: C.clampStr(row.notes || '', C.LIMITS.notesMax),
          };
        });

        const subtotalVal = compiledItems.reduce((sum, i) => sum + i.price * i.quantity, 0);
        const taxVal = subtotalVal * 0.16;
        const calculatedTotal = subtotalVal + taxVal;

        try {
          if (editingOrder) {
            const updates = {
              branch_id: C.sanitizeId(orderForm.branch_id, 'b1'),
              table_number: C.clampStr(orderForm.table_number || 'T-01', C.LIMITS.tableMax),
              customer_name: C.clampStr(orderForm.customer_name, C.LIMITS.shortNameMax),
              customer_phone: C.clampStr(orderForm.customer_phone, C.LIMITS.phoneMax),
              order_type: orderForm.order_type,
              payment_method: orderForm.payment_method,
              status: orderForm.status,
              items: compiledItems,
              subtotal: Number(subtotalVal.toFixed(0)),
              discount_amount: 0,
              tax_amount: Number(taxVal.toFixed(0)),
              total_amount: Number(calculatedTotal.toFixed(0)),
              custom_notes: C.clampStr(orderForm.custom_notes, C.LIMITS.notesMax),
            };
            if (cloudConnected) {
              await C.updateCloudDoc('orders', editingOrder.id, updates);
            } else {
              setOrders((prev) => prev.map((o) => o.id === editingOrder.id ? { ...o, ...updates } : o));
            }
            showToast(`Order ${editingOrder.order_number} updated!`, 'success');
          } else {
            const id = `ord-${Date.now()}`;
            const newOrd = {
              id,
              order_number: `#${Math.floor(1000 + Math.random() * 9000)}`,
              branch_id: C.sanitizeId(orderForm.branch_id, 'b1'),
              table_number: C.clampStr(orderForm.table_number || 'T-01', C.LIMITS.tableMax),
              customer_name: C.clampStr(orderForm.customer_name, C.LIMITS.shortNameMax),
              customer_phone: C.clampStr(orderForm.customer_phone, C.LIMITS.phoneMax),
              order_type: orderForm.order_type,
              status: orderForm.status,
              items: compiledItems,
              subtotal: Number(subtotalVal.toFixed(0)),
              discount_amount: 0,
              tax_amount: Number(taxVal.toFixed(0)),
              total_amount: Number(calculatedTotal.toFixed(0)),
              payment_method: orderForm.payment_method,
              custom_notes: C.clampStr(orderForm.custom_notes, C.LIMITS.notesMax),
              created_by: C.clampStr(currentUser?.name || 'Admin', C.LIMITS.shortNameMax),
              created_at: new Date().toISOString(),
            };
            if (cloudConnected) {
              await C.createCloudDoc('orders', id, newOrd, allowedEmails);
            } else {
              setOrders((prev) => [newOrd, ...prev]);
            }
            showToast(`New Order ${newOrd.order_number} created!`, 'success');
          }
          setAddModalOpen(false);
        } catch (err) {
          showToast('Failed to save order to cloud.', 'error');
        }
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Order History & Management</h2>
              <p className="text-xs text-slate-500">Create, edit, view receipts, or void branch orders</p>
            </div>
            <div className="flex items-center gap-3">
              <button
                onClick={handleOpenAddModal}
                className="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow-md shadow-orange-500/20 transition"
              >
                <Icon name="plus" className="w-4 h-4" /> Create New Order
              </button>
            </div>
          </div>

          <div className="flex items-center gap-2 overflow-x-auto pb-1">
            {['All', 'New Orders', 'In Preparation', 'Ready for Pickup', 'Completed', 'Cancelled'].map((st) => (
              <button

          <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">

              </thead>
              <tbody className="divide-y divide-slate-100">
                {filtered.length === 0 ? (
                  <tr>

                      <td className="p-4 font-extrabold text-orange-600">{ord.order_number}</td>

                      <td className="p-4 font-medium">
                        {ord.table_number} <span className="text-slate-400">({ord.order_type})</span>
                      </td>
                      <td className="p-4 font-semibold">{(ord.items || []).length} items</td>
                      <td className="p-4 font-bold text-slate-900">Rs. {Number(ord.total_amount || 0).toLocaleString()}</td>
                      <td className="p-4">
                        <span

                            ord.status === 'Completed'

                              ? 'bg-amber-100 text-amber-700'
                              : ord.status === 'Cancelled'

                      </td>
                      <td className="p-4 text-right space-x-1.5">
                        <button onClick={() => setReceiptModalOrder(ord)} className="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[11px] transition">
                          Receipt

                        <button onClick={() => handleOpenEditModal(ord)} className="px-2.5 py-1.5 rounded-lg bg-orange-100 hover:bg-orange-200 text-orange-700 font-bold text-[11px] transition">
                          Edit

                        <button onClick={() => { setVoidTarget(ord); setVoidReason(''); }} className="px-2.5 py-1.5 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-[11px] transition">
                          Void

                      </td>
                    </tr>

              </tbody>
            </table>
          </div>

          {voidTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">

                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setVoidTarget(null)} className="rounded-xl bg-slate-100 px-4 py-2 text-xs font-bold text-slate-700">Cancel</button>
                  <button type="submit" className="rounded-xl bg-rose-600 px-4 py-2 text-xs font-bold text-white hover:bg-rose-700">Confirm Void</button>
                </div>
              </form>
            </div>

          {/* CREATE / EDIT ORDER MODAL */}
          {addModalOpen && (

                        <option value="New Orders">New Orders</option>
                        <option value="In Preparation">In Preparation</option>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-slate-500 block mb-1">Order Type</label>
                      <select value={orderForm.order_type} onChange={(e) => setOrderForm({ ...orderForm, order_type: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 font-bold focus:outline-none">
                        <option value="Dine-in">Dine-in</option>

                    </div>
                    <div>
                      <label className="text-slate-500 block mb-1">Table Number</label>

                    <div>
                      <label className="text-slate-500 block mb-1">Payment Method</label>
                      <select value={orderForm.payment_method} onChange={(e) => setOrderForm({ ...orderForm, payment_method: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 font-bold focus:outline-none">
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="Gift Card">Gift Card</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <input type="text" placeholder="Customer name (optional)" value={orderForm.customer_name} onChange={(e) => setOrderForm({ ...orderForm, customer_name: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800" />
                    <input type="tel" placeholder="Customer phone (optional)" value={orderForm.customer_phone} onChange={(e) => setOrderForm({ ...orderForm, customer_phone: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800" />
                  </div>
                  <input type="text" placeholder="Order notes (optional)" value={orderForm.custom_notes} onChange={(e) => setOrderForm({ ...orderForm, custom_notes: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800" />

                  <div className="border-t border-slate-100 pt-3">
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-slate-700 font-bold">Select Order Items</label>
                      <button type="button" onClick={handleAddItemToForm} className="text-orange-600 hover:text-orange-700 font-bold text-[11px] flex items-center gap-1">
                        <Icon name="plus" className="w-3.5 h-3.5" /> Add Row
                      </button>
                    </div>
                    <div className="space-y-2">
                      {orderForm.items.map((row, idx) => (
                        <div key={idx} className="flex gap-2 items-center bg-slate-50 p-2 rounded-xl border border-slate-200">
                          {menuItems.length > 0 ? (
                            <select
                              value={row.item_id}
                              onChange={(e) => {
                                const val = e.target.value;
                                setOrderForm((prev) => ({ ...prev, items: prev.items.map((it, i) => (i === idx ? { ...it, item_id: val } : it)) }));
                              }}
                              className="flex-1 bg-white border border-slate-200 text-xs rounded-lg p-2 font-semibold text-slate-800"
                            >
                              {menuItems.map((m) => <option key={m.id} value={m.id}>{m.name} (Rs. {m.price})</option>)}
                            </select>
                          ) : (
                            <input type="text" placeholder="Add item in Menu Setup first" disabled className="flex-1 bg-slate-100 border border-slate-200 text-xs rounded-lg p-2 text-slate-400" />
                          )}
                          <input
                            type="number" min="1" value={row.quantity}
                            onChange={(e) => {
                              const val = e.target.value;
                              setOrderForm((prev) => ({ ...prev, items: prev.items.map((it, i) => (i === idx ? { ...it, quantity: val } : it)) }));
                            }}
                            className="w-16 bg-white border border-slate-200 text-xs rounded-lg p-2 font-bold text-center"
                          />
                          <input
                            type="text" placeholder="Notes..." value={row.notes}
                            onChange={(e) => {
                              const val = e.target.value;
                              setOrderForm((prev) => ({ ...prev, items: prev.items.map((it, i) => (i === idx ? { ...it, notes: val } : it)) }));
                            }}
                            className="w-28 bg-white border border-slate-200 text-xs rounded-lg p-2 text-slate-600"
                          />
                          {orderForm.items.length > 1 && (
                            <button type="button" onClick={() => handleRemoveItemFromForm(idx)} className="p-1.5 text-rose-500 hover:text-rose-700">
                              <Icon name="trash-2" className="w-4 h-4" />
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition shadow-md shadow-orange-500/30 text-sm mt-2">
                    {editingOrder ? 'Update Order Details' : 'Save & Submit Order'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE: KITCHEN DISPLAY SYSTEM (KDS)
    // ==========================================
    function KDSModule({ orders, setOrders, showToast, branches, kdsSoundEnabled, setKdsSoundEnabled, cloudConnected, C }) {
      const advanceOrder = async (order) => {
        const nextStatus = order.status === 'New Orders' ? 'In Preparation' : order.status === 'In Preparation' ? 'Ready for Pickup' : 'Completed';
        try {
          if (cloudConnected) {
            await C.updateCloudDoc('orders', order.id, { status: nextStatus });
          } else {
            setOrders((prev) => prev.map((item) => item.id === order.id ? { ...item, status: nextStatus } : item));
          }
          showToast(`${order.order_number} moved to ${nextStatus}`, 'success');
        } catch (err) {
          showToast('Could not update kitchen status.', 'error');
        }
      };

      const activeOrders = [...orders]
        .filter((order) => !['Completed', 'Cancelled'].includes(order.status))
        .sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));

      return (
        <div className="space-y-4">
          <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Kitchen Display (KDS)</h2>
              <p className="text-xs text-slate-500">Orders submitted from Waiter / Cashier POS appear here live</p>
            </div>
            <button
              type="button"
              onClick={() => setKdsSoundEnabled(!kdsSoundEnabled)}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 ${
                kdsSoundEnabled ? 'bg-orange-50 border-orange-200 text-orange-700' : 'bg-slate-100 border-slate-200 text-slate-600'
              }`}
            >
              <Icon name={kdsSoundEnabled ? 'volume-2' : 'volume-x'} className="w-3.5 h-3.5" />
              {kdsSoundEnabled ? 'Kitchen Chime On' : 'Kitchen Chime Muted'}
            </button>
          </div>

          {activeOrders.length === 0 ? (
            <div className="bg-white border border-slate-200 p-8 rounded-2xl text-center text-sm text-slate-500 shadow-sm">
              No active orders in kitchen queue.
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              {activeOrders.map((order) => (
                <div key={order.id} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                  <div className="flex justify-between items-center gap-3">
                    <h3 className="font-extrabold text-orange-600 text-base">{order.order_number}</h3>
                    <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                      order.status === 'New Orders' ? 'bg-sky-100 text-sky-700' :
                      order.status === 'In Preparation' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'
                    }`}>{order.status}</span>
                  </div>
                  <p className="text-xs text-slate-500 font-medium">
                    {branches.find((branch) => branch.id === order.branch_id)?.name || order.branch_id} · {order.order_type} · {order.table_number}
                  </p>
                  {order.custom_notes && (
                    <p className="text-xs bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-2.5 py-1.5 font-medium">
                      Note: {order.custom_notes}
                    </p>
                  )}
                  <ul className="text-sm space-y-1.5 border-t border-b border-slate-100 py-2">
                    {(order.items || []).map((item, index) => (
                      <li key={`${item.id}-${index}`} className="font-semibold text-slate-800">
                        {item.quantity} × {item.name}
                        {item.notes && <span className="block text-xs font-normal text-orange-600"> — {item.notes}</span>}
                      </li>
                    ))}
                  </ul>
                  <button onClick={() => advanceOrder(order)} className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl py-2.5 text-xs shadow-sm">
                    {order.status === 'New Orders' ? 'Start preparation' : order.status === 'In Preparation' ? 'Mark ready' : 'Complete order'}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE: CASH REGISTER & Z-REPORT MODAL
    // ==========================================
    function CashRegisterModule({ registerState, setRegisterState, registerExistsInCloud, orders, showToast, setShowZReportModal, cloudConnected, allowedEmails, C }) {
      const [cashDropAmt, setCashDropAmt] = useState('');
      const [cashDropNote, setCashDropNote] = useState('');
      const [openingFloatInput, setOpeningFloatInput] = useState(String(registerState.openingBalance ?? 10000));

      useEffect(() => {
        setOpeningFloatInput(String(registerState.openingBalance ?? 10000));
      }, [registerState.openingBalance]);

      const saveRegister = async (nextState) => {
        if (cloudConnected) {
          await C.upsertCashRegister('main', nextState, allowedEmails, registerExistsInCloud);
        } else {
          setRegisterState(nextState);
        }
      };

      const handleCashDrop = async () => {
        const amount = Number(cashDropAmt);
        if (!Number.isFinite(amount) || amount <= 0) return;
        if (amount > registerState.currentCash) {
          showToast('Cash drop cannot exceed the drawer balance.', 'error');
          return;
        }
        const nextState = {
          ...registerState,
          cashDrops: [...(registerState.cashDrops || []), { id: Date.now(), amount, time: new Date().toLocaleTimeString(), note: cashDropNote.trim() }],
          currentCash: Number(registerState.currentCash || 0) - amount,
        };
        try {
          await saveRegister(nextState);
          showToast(`Cash drop of Rs. ${cashDropAmt} recorded!`, 'success');
          setCashDropAmt('');
          setCashDropNote('');
        } catch (err) {
          showToast('Failed to record cash drop in cloud.', 'error');
        }
      };

      const handleUpdateFloat = async (e) => {
        e.preventDefault();
        const bal = Number(openingFloatInput);
        if (!Number.isFinite(bal) || bal < 0) return;
        const diff = bal - Number(registerState.openingBalance || 0);
        const nextState = {
          ...registerState,
          openingBalance: bal,
          currentCash: Math.max(0, Number(registerState.currentCash || 0) + diff),
        };
        try {
          await saveRegister(nextState);
          showToast('Opening cash float updated!', 'success');
        } catch (err) {
          showToast('Failed to update opening float.', 'error');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Cash Register & Shift Control</h2>
              <p className="text-xs text-slate-500">Manage float balance, record cash drops, and produce official End-of-Shift Z-Reports</p>
            </div>
            <div className="flex gap-3">
              <button onClick={() => setShowZReportModal(true)} className="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow-md shadow-orange-500/20">
                <Icon name="file-text" className="w-4 h-4" /> Print End-of-Shift Z-Report
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <span className="text-xs font-semibold text-slate-500">Opening Cash Float</span>
              <h3 className="text-2xl font-extrabold text-slate-900 mt-1">Rs. {Number(registerState.openingBalance || 0).toLocaleString()}</h3>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <span className="text-xs font-semibold text-slate-500">Current Cash in Drawer</span>
              <h3 className="text-2xl font-extrabold text-emerald-600 mt-1">Rs. {Number(registerState.currentCash || 0).toLocaleString()}</h3>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
              <span className="text-xs font-semibold text-slate-500">Total Cash Drops Executed</span>
              <h3 className="text-2xl font-extrabold text-amber-600 mt-1">{(registerState.cashDrops || []).length} Drops</h3>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
              <h3 className="font-bold text-sm text-slate-900">Perform Safe Cash Drop</h3>
              <div className="flex flex-wrap gap-3">
                <input type="number" placeholder="Drop Amount (Rs.)..." value={cashDropAmt} onChange={(e) => setCashDropAmt(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold w-44" />
                <input type="text" placeholder="Note (e.g. Vault transfer)..." value={cashDropNote} onChange={(e) => setCashDropNote(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs flex-1 min-w-[160px]" />
                <button onClick={handleCashDrop} className="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs">Execute Drop</button>
              </div>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
              <h3 className="font-bold text-sm text-slate-900">Adjust Opening Float</h3>
              <form onSubmit={handleUpdateFloat} className="flex flex-wrap gap-3">
                <input type="number" min="0" value={openingFloatInput} onChange={(e) => setOpeningFloatInput(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold w-48" />
                <button type="submit" className="px-4 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs">Update Float</button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function ZReportModal({ registerState, orders, onClose }) {
      const activeOrders = orders.filter((o) => o.status !== 'Cancelled');
      const cashSales = activeOrders.filter((o) => o.payment_method === 'Cash').reduce((sum, o) => sum + Number(o.total_amount || 0), 0);
      const totalDrops = (registerState.cashDrops || []).reduce((sum, drop) => sum + Number(drop.amount || 0), 0);
      const expectedCash = Number(registerState.openingBalance || 0) + cashSales - totalDrops;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
            <div className="text-center border-b border-dashed border-slate-300 pb-3">
              <h2 className="font-extrabold text-lg text-slate-900">ROYAL INDIA BY SPICY TWIST Z-REPORT</h2>
              <p className="text-[10px] text-slate-500">Official End-of-Shift Terminal Audit</p>
              <p className="text-[10px] text-slate-400 mt-1">{new Date().toLocaleString()}</p>
            </div>

            <div className="text-xs space-y-2 text-slate-700">
              <div className="flex justify-between"><span>Opening Cash Float:</span><span className="font-bold">Rs. {Number(registerState.openingBalance || 0).toLocaleString()}</span></div>
              <div className="flex justify-between"><span>Cash Sales:</span><span className="font-bold text-orange-600">Rs. {cashSales.toLocaleString()}</span></div>
              <div className="flex justify-between"><span>Cash Drops:</span><span className="font-bold">Rs. {totalDrops.toLocaleString()}</span></div>
              <div className="flex justify-between"><span>Total Orders Processed:</span><span className="font-bold">{activeOrders.length}</span></div>
              <div className="flex justify-between border-t border-dashed border-slate-200 pt-2 font-extrabold text-slate-900">
                <span>Expected Cash In Drawer:</span>
                <span className="text-emerald-600">Rs. {expectedCash.toLocaleString()}</span>
              </div>
            </div>

            <div className="pt-3 flex gap-2">
              <button onClick={() => window.print()} className="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-xl text-xs">Print Z-Report</button>
              <button onClick={onClose} className="px-4 bg-slate-200 text-slate-800 font-bold py-2 rounded-xl text-xs">Close</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: SALES & FINANCIAL REPORTS (GST Breakdown)
    // ==========================================

      const totalGST = grossSales * (16 / 116);
      const netSales = grossSales - totalGST;

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
            <h2 className="text-lg font-bold text-slate-900">Sales & Financial Reporting</h2>
            <p className="text-xs text-slate-500 mt-0.5">Daily, weekly, and monthly sales summaries & official GST tax logs</p>

            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6">
              <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                <span className="text-xs font-semibold text-slate-500">Gross Sales</span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">Rs. {grossSales.toLocaleString()}</h3>
              </div>
              <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                <span className="text-xs font-semibold text-slate-500">Net Revenue (Excl Tax)</span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">Rs. {netSales.toLocaleString(undefined, { maximumFractionDigits: 0 })}</h3>
              </div>
              <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl">
                <span className="text-xs font-bold text-amber-800">Total GST Tax (16%)</span>
                <h3 className="text-xl font-extrabold text-amber-900 mt-1">Rs. {totalGST.toLocaleString(undefined, { maximumFractionDigits: 0 })}</h3>
                <p className="text-[10px] text-amber-700 mt-1">Tax extracted from GST-inclusive sales</p>
              </div>
              <div className="bg-rose-50 border border-rose-200 p-4 rounded-xl">
                <span className="text-xs font-bold text-rose-800">Void & Refunded Logs</span>
                <h3 className="text-xl font-extrabold text-rose-900 mt-1">{voidLogs.length} Voids</h3>
              </div>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
              <Icon name="ban" className="w-4 h-4 text-rose-600" /> Void & Refund Audit Log
            </h3>
            <table className="w-full text-left text-xs text-slate-700">
              <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px]">
                <tr>
                  <th className="p-3">Order Ref</th>
                  <th className="p-3">Item Voided</th>
                  <th className="p-3">Amount</th>
                  <th className="p-3">Reason</th>
                  <th className="p-3">Authorized By</th>
                  <th className="p-3">Timestamp</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {voidLogs.length === 0 ? (
                  <tr><td colSpan="6" className="p-4 text-center text-slate-400">No voids or refunds recorded.</td></tr>
                ) : (
                  voidLogs.map((log) => (
                    <tr key={log.id} className="hover:bg-slate-50">
                      <td className="p-3 font-bold text-orange-600">{log.orderNumber}</td>
                      <td className="p-3 font-semibold text-slate-800">{log.item}</td>
                      <td className="p-3 font-bold text-slate-900">Rs. {log.amount}</td>
                      <td className="p-3 text-slate-600">{log.reason}</td>
                      <td className="p-3 font-medium text-slate-700">{log.voidedBy}</td>
